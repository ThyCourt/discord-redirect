<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Court's</title>
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Botpress Webchat Scripts -->
    <script src="https://cdn.botpress.cloud/webchat/v3.7/inject.js"></script>
    <script src="https://files.bpcontent.cloud/2026/08/28/21/20260828213322-F1IPJ1GG.js" defer></script>
    
    <style>
        /* ─── CUSTOM CURSOR ─── */
        * {
            cursor: none !important;
        }

        .custom-cursor {
            position: fixed;
            pointer-events: none;
            z-index: 99999;
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            width: 32px;
            height: 32px;
            transform: translate(-50%, -50%);
            transition: width 0.15s ease, height 0.15s ease, border-color 0.3s ease, background 0.3s ease;
            background: rgba(255, 255, 255, 0);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.05);
        }

        .custom-cursor.hover {
            width: 48px;
            height: 48px;
            border-color: rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.05);
            border-width: 1.5px;
        }

        .custom-cursor.click {
            width: 20px;
            height: 20px;
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(255, 255, 255, 0.1);
        }

        .custom-cursor.hidden {
            opacity: 0;
        }

        /* ─── RESET ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
            background: linear-gradient(135deg, #0a0e1a, #141b2b, #1a2340, #0d1225, #0a0e1a);
            background-size: 600% 600%;
            animation: nightGradient 15s ease-in-out infinite;
            transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body.day-mode {
            background: linear-gradient(135deg, #87CEEB, #4A90D9, #1E5FAF, #87CEEB, #4A90D9);
            background-size: 600% 600%;
            animation: dayGradient 12s ease-in-out infinite;
        }

        body.night-mode {
            background: linear-gradient(135deg, #0a0e1a, #141b2b, #1a2340, #0d1225, #0a0e1a);
            background-size: 600% 600%;
            animation: nightGradient 15s ease-in-out infinite;
        }

        @keyframes dayGradient {
            0% { background-position: 0% 50%; }
            20% { background-position: 50% 100%; }
            40% { background-position: 100% 50%; }
            60% { background-position: 50% 0%; }
            80% { background-position: 0% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes nightGradient {
            0% { background-position: 0% 50%; }
            25% { background-position: 50% 100%; }
            50% { background-position: 100% 50%; }
            75% { background-position: 50% 0%; }
            100% { background-position: 0% 50%; }
        }

        /* ─── CLOUDS ─── */
        .clouds {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
            overflow: hidden;
            transition: opacity 1.2s ease;
        }

        .cloud {
            position: absolute;
            border-radius: 1000px;
            animation: cloudFloat linear infinite;
            will-change: transform;
            transition: background 1.2s ease, box-shadow 1.2s ease;
        }

        .night-mode .cloud {
            background: rgba(200, 210, 255, 0.15) !important;
            box-shadow: 0 0 60px rgba(150, 180, 255, 0.05) !important;
        }

        .night-mode .cloud::before,
        .night-mode .cloud::after {
            background: inherit !important;
            box-shadow: inherit !important;
        }

        .day-mode .cloud {
            background: rgba(255, 255, 255, 0.5) !important;
            box-shadow: 0 0 60px rgba(255, 255, 255, 0.15) !important;
        }

        .day-mode .cloud::before,
        .day-mode .cloud::after {
            background: inherit !important;
            box-shadow: inherit !important;
        }

        .cloud-1 {
            width: 400px;
            height: 90px;
            top: 5%;
            left: -450px;
            animation-duration: 35s;
        }
        .cloud-1::before {
            content: '';
            position: absolute;
            width: 160px;
            height: 160px;
            top: -80px;
            left: 40px;
            border-radius: 50%;
            background: inherit;
            box-shadow: inherit;
        }
        .cloud-1::after {
            content: '';
            position: absolute;
            width: 200px;
            height: 180px;
            top: -90px;
            left: 120px;
            border-radius: 50%;
            background: inherit;
            box-shadow: inherit;
        }

        .cloud-2 {
            width: 300px;
            height: 70px;
            top: 20%;
            left: -350px;
            animation-duration: 40s;
            animation-delay: -8s;
        }
        .cloud-2::before {
            content: '';
            position: absolute;
            width: 120px;
            height: 120px;
            top: -60px;
            left: 30px;
            border-radius: 50%;
            background: inherit;
            box-shadow: inherit;
        }
        .cloud-2::after {
            content: '';
            position: absolute;
            width: 150px;
            height: 140px;
            top: -70px;
            left: 90px;
            border-radius: 50%;
            background: inherit;
            box-shadow: inherit;
        }

        .cloud-3 {
            width: 220px;
            height: 55px;
            top: 45%;
            left: -270px;
            animation-duration: 45s;
            animation-delay: -15s;
        }
        .cloud-3::before {
            content: '';
            position: absolute;
            width: 90px;
            height: 90px;
            top: -45px;
            left: 20px;
            border-radius: 50%;
            background: inherit;
            box-shadow: inherit;
        }
        .cloud-3::after {
            content: '';
            position: absolute;
            width: 110px;
            height: 100px;
            top: -50px;
            left: 65px;
            border-radius: 50%;
            background: inherit;
            box-shadow: inherit;
        }

        .cloud-4 {
            width: 450px;
            height: 100px;
            bottom: 15%;
            left: -500px;
            animation-duration: 50s;
            animation-delay: -5s;
        }
        .cloud-4::before {
            content: '';
            position: absolute;
            width: 180px;
            height: 180px;
            top: -90px;
            left: 50px;
            border-radius: 50%;
            background: inherit;
            box-shadow: inherit;
        }
        .cloud-4::after {
            content: '';
            position: absolute;
            width: 220px;
            height: 200px;
            top: -100px;
            left: 150px;
            border-radius: 50%;
            background: inherit;
            box-shadow: inherit;
        }

        .cloud-5 {
            width: 280px;
            height: 65px;
            top: 8%;
            left: -320px;
            animation-duration: 38s;
            animation-delay: -20s;
        }
        .cloud-5::before {
            content: '';
            position: absolute;
            width: 110px;
            height: 110px;
            top: -55px;
            left: 25px;
            border-radius: 50%;
            background: inherit;
            box-shadow: inherit;
        }
        .cloud-5::after {
            content: '';
            position: absolute;
            width: 130px;
            height: 120px;
            top: -60px;
            left: 80px;
            border-radius: 50%;
            background: inherit;
            box-shadow: inherit;
        }

        .cloud-6 {
            width: 160px;
            height: 40px;
            top: 60%;
            left: -200px;
            animation-duration: 55s;
            animation-delay: -12s;
        }
        .cloud-6::before {
            content: '';
            position: absolute;
            width: 65px;
            height: 65px;
            top: -32px;
            left: 15px;
            border-radius: 50%;
            background: inherit;
            box-shadow: inherit;
        }
        .cloud-6::after {
            content: '';
            position: absolute;
            width: 80px;
            height: 75px;
            top: -38px;
            left: 50px;
            border-radius: 50%;
            background: inherit;
            box-shadow: inherit;
        }

        @keyframes cloudFloat {
            0% { transform: translateX(0px); }
            100% { transform: translateX(calc(100vw + 600px)); }
        }

        /* ─── AMBIENT GLOW ORBS ─── */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            z-index: 0;
            transition: opacity 1.2s ease, background 1.2s ease;
        }

        .night-mode::before {
            background: radial-gradient(ellipse at 30% 50%, rgba(100, 150, 255, 0.15) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(150, 100, 255, 0.1) 0%, transparent 50%);
            animation: ambientDrift 25s ease-in-out infinite alternate;
            opacity: 0.3;
        }

        .day-mode::before {
            background: radial-gradient(ellipse at 30% 50%, rgba(255, 255, 255, 0.12) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(255, 255, 255, 0.08) 0%, transparent 50%);
            animation: ambientDrift 25s ease-in-out infinite alternate;
            opacity: 1;
        }

        @keyframes ambientDrift {
            0% { transform: translate(0%, 0%) rotate(0deg) scale(1); }
            50% { transform: translate(3%, 2%) rotate(2deg) scale(1.05); }
            100% { transform: translate(-2%, 4%) rotate(-2deg) scale(0.95); }
        }

        /* ─── MAIN PAGE ─── */
        #mainPage {
            position: relative;
            z-index: 2;
            border-radius: 48px;
            padding: 70px 50px 50px;
            max-width: 580px;
            width: 100%;
            text-align: center;
            display: block;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .night-mode #mainPage {
            background: rgba(10, 10, 20, 0.15);
            backdrop-filter: blur(80px);
            -webkit-backdrop-filter: blur(80px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 50px 100px -30px rgba(0, 0, 0, 0.6),
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .day-mode #mainPage {
            background: rgba(10, 10, 10, 0.08);
            backdrop-filter: blur(80px);
            -webkit-backdrop-filter: blur(80px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 50px 100px -30px rgba(0, 0, 0, 0.2),
                        inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        #mainPage.hidden {
            display: none;
        }

        #mainPage.slide-out {
            animation: mainSlideOut 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        #mainPage.slide-in {
            animation: mainSlideIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes mainSlideOut {
            0% { opacity: 1; transform: scale(1) translateY(0); }
            100% { opacity: 0; transform: scale(0.95) translateY(-20px); }
        }

        @keyframes mainSlideIn {
            0% { opacity: 0; transform: scale(0.95) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* ─── TYPEWRITER TITLE ─── */
        .title-wrapper {
            min-height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 40px;
        }

        #typewriter {
            font-size: 3.5rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -1.5px;
            line-height: 1.1;
            position: relative;
            transition: text-shadow 1.2s ease;
        }

        .night-mode #typewriter {
            text-shadow: 0 0 80px rgba(100, 150, 255, 0.15),
                         0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .day-mode #typewriter {
            text-shadow: 0 0 60px rgba(255, 255, 255, 0.2),
                         0 4px 20px rgba(0, 0, 0, 0.3);
        }

        #typewriter .cursor {
            display: inline-block;
            width: 4px;
            height: 0.8em;
            margin-left: 6px;
            border-radius: 2px;
            animation: blink 0.8s step-end infinite;
            transition: background 1.2s ease, box-shadow 1.2s ease;
        }

        .night-mode #typewriter .cursor {
            background: linear-gradient(180deg, #6c8cff, #a78bfa);
            box-shadow: 0 0 30px rgba(100, 150, 255, 0.2);
        }

        .day-mode #typewriter .cursor {
            background: linear-gradient(180deg, #6cc4ff, #a78bfa);
            box-shadow: 0 0 30px rgba(108, 196, 255, 0.3);
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ─── BUTTON WRAPPER ─── */
        .btn-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
            margin-bottom: 12px;
        }

        .btn-wrapper:last-of-type {
            margin-bottom: 0;
        }

        /* ─── MAGNETIC BUTTON EFFECT ─── */
        .magnetic-btn {
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.3s ease,
                        background 0.3s ease;
            will-change: transform;
            position: relative;
            z-index: 1;
        }

        .magnetic-btn::after {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 68px;
            background: rgba(255, 255, 255, 0);
            filter: blur(20px);
            transition: all 0.4s ease;
            z-index: -1;
            pointer-events: none;
        }

        .magnetic-btn:hover::after {
            background: rgba(255, 255, 255, 0.05);
            filter: blur(30px);
            transform: scale(1.1);
        }

        /* ─── BROWSE PLANS BUTTON ─── */
        .btn-plans {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px 56px;
            font-size: 1.15rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #2b2b2b, #1a1a1a, #0d0d0d, #2b2b2b);
            background-size: 300% 300%;
            border: none;
            border-radius: 60px;
            cursor: none !important;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                        background-position 8s ease-in-out;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
            letter-spacing: 0.5px;
            overflow: hidden;
            animation: plansGradient 8s ease-in-out infinite;
            width: 100%;
            will-change: transform;
        }

        @keyframes plansGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn-plans::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 64px;
            background: linear-gradient(135deg, rgba(43, 43, 43, 0.5), rgba(13, 13, 13, 0.5));
            filter: blur(20px);
            opacity: 0;
            transition: all 0.6s ease;
            z-index: -1;
        }

        .btn-plans:hover::before {
            opacity: 1;
            filter: blur(30px);
            animation: pulseGlow 1.5s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .btn-plans::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 60px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent 50%, rgba(255, 255, 255, 0.03));
            pointer-events: none;
        }

        .btn-plans:hover {
            transform: scale(1.05) translateY(-4px);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5),
                        0 0 100px rgba(0, 0, 0, 0.2);
            animation-play-state: paused;
        }

        .btn-plans:active {
            transform: scale(0.94) translateY(0px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition-duration: 0.1s;
        }

        .globe-icon {
            width: 28px;
            height: 28px;
            fill: none;
            stroke: #ffffff;
            stroke-width: 2;
            display: block;
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .btn-plans:hover .globe-icon {
            transform: scale(1.1) rotate(-5deg);
        }

        /* ─── GAMBLE BUTTON ─── */
        .btn-gamble {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px 56px;
            font-size: 1.15rem;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #cc0000, #ff1a1a, #cc0000, #ff3333);
            background-size: 300% 300%;
            border: none;
            border-radius: 60px;
            cursor: none !important;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                        background-position 8s ease-in-out;
            box-shadow: 0 8px 40px rgba(204, 0, 0, 0.5);
            letter-spacing: 0.5px;
            overflow: hidden;
            animation: gambleGradient 8s ease-in-out infinite, shake 0.5s ease-in-out infinite;
            width: 100%;
            will-change: transform;
            text-transform: uppercase;
            font-family: 'Inter', sans-serif;
        }

        @keyframes gambleGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes shake {
            0%, 100% { transform: rotate(-1.5deg) scale(1); }
            25% { transform: rotate(1.5deg) scale(1.01); }
            50% { transform: rotate(-1.5deg) scale(0.99); }
            75% { transform: rotate(1.5deg) scale(1.01); }
        }

        .btn-gamble::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 64px;
            background: linear-gradient(135deg, rgba(204, 0, 0, 0.6), rgba(255, 50, 50, 0.3));
            filter: blur(20px);
            opacity: 0;
            transition: all 0.6s ease;
            z-index: -1;
        }

        .btn-gamble:hover::before {
            opacity: 1;
            filter: blur(30px);
            animation: pulseGlow 1.5s ease-in-out infinite;
        }

        .btn-gamble::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 60px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.15), transparent 50%, rgba(255, 255, 255, 0.05));
            pointer-events: none;
        }

        .btn-gamble:hover {
            transform: scale(1.05) translateY(-4px) rotate(0deg);
            box-shadow: 0 20px 60px rgba(204, 0, 0, 0.6),
                        0 0 100px rgba(204, 0, 0, 0.2);
            animation-play-state: paused;
        }

        .btn-gamble:active {
            transform: scale(0.94) translateY(0px);
            box-shadow: 0 4px 20px rgba(204, 0, 0, 0.3);
            transition-duration: 0.1s;
        }

        .redirect-icon {
            width: 28px;
            height: 28px;
            fill: #ffffff;
            display: block;
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .btn-gamble:hover .redirect-icon {
            transform: translateX(4px) scale(1.1);
        }

        /* ─── DISCORD BUTTON ─── */
        .btn-discord {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px 56px;
            font-size: 1.15rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #5865F2, #4752C4, #3B45A5, #5865F2);
            background-size: 300% 300%;
            border: none;
            border-radius: 60px;
            cursor: none !important;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                        background-position 8s ease-in-out;
            box-shadow: 0 8px 40px rgba(88, 101, 242, 0.4);
            letter-spacing: 0.5px;
            overflow: hidden;
            animation: discordGradient 8s ease-in-out infinite;
            width: 100%;
            will-change: transform;
        }

        @keyframes discordGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn-discord::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 64px;
            background: linear-gradient(135deg, rgba(88, 101, 242, 0.5), rgba(59, 69, 165, 0.5));
            filter: blur(20px);
            opacity: 0;
            transition: all 0.6s ease;
            z-index: -1;
        }

        .btn-discord:hover::before {
            opacity: 1;
            filter: blur(30px);
            animation: pulseGlow 1.5s ease-in-out infinite;
        }

        .btn-discord::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 60px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent 50%, rgba(255, 255, 255, 0.05));
            pointer-events: none;
        }

        .btn-discord:hover {
            transform: scale(1.05) translateY(-4px);
            box-shadow: 0 20px 60px rgba(88, 101, 242, 0.5),
                        0 0 100px rgba(88, 101, 242, 0.2);
            animation-play-state: paused;
        }

        .btn-discord:active {
            transform: scale(0.94) translateY(0px);
            box-shadow: 0 4px 20px rgba(88, 101, 242, 0.2);
            transition-duration: 0.1s;
        }

        .discord-icon {
            width: 28px;
            height: 28px;
            fill: #ffffff;
            display: block;
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .btn-discord:hover .discord-icon {
            transform: scale(1.1) rotate(-5deg);
        }

        /* ─── BUTTONS CONTAINER ─── */
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        /* ─── FOOTER ─── */
        .footer {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .mail-icon {
            width: 18px;
            height: 18px;
            transition: fill 0.3s ease, transform 0.3s ease;
            flex-shrink: 0;
        }

        .night-mode .mail-icon {
            fill: rgba(200, 210, 255, 0.6);
        }

        .day-mode .mail-icon {
            fill: rgba(255, 255, 255, 0.8);
        }

        .footer:hover .mail-icon {
            fill: #ffffff;
            transform: scale(1.1);
        }

        .footer-text {
            font-size: 0.7rem;
            letter-spacing: 0.5px;
            font-weight: 300;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            transition: color 0.3s ease;
        }

    <script>
        // ──────────────────────────────────────────────
        //  1. TELEGRAM MINI APP INIT
        // ──────────────────────────────────────────────
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ──────────────────────────────────────────────
        //  2. TYPEWRITER EFFECT
        // ──────────────────────────────────────────────
        const textElement = document.getElementById('typed-text');
        const words = ['Court\'s'];
        let wordIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        let speed = 200;

        function typeEffect() {
            const currentWord = words[wordIndex];
            const currentText = textElement.textContent;

            if (!isDeleting) {
                textElement.textContent = currentWord.substring(0, charIndex + 1);
                charIndex++;

                if (charIndex === currentWord.length) {
                    isDeleting = true;
                    speed = 2000;
                    setTimeout(() => { speed = 100; }, 2000);
                }
            } else {
                textElement.textContent = currentWord.substring(0, charIndex - 1);
                charIndex--;

                if (charIndex === 0) {
                    isDeleting = false;
                    wordIndex = (wordIndex + 1) % words.length;
                    speed = 150;
                }
            }

            setTimeout(typeEffect, speed);
        }

        setTimeout(typeEffect, 500);

        // ──────────────────────────────────────────────
        //  3. SHOW/HIDE PLANS PAGE
        // ──────────────────────────────────────────────
        function showPlans() {
            const mainPage = document.getElementById('mainPage');
            const plansPage = document.getElementById('plansPage');
            
            playClickSound();
            
            mainPage.classList.remove('slide-in');
            mainPage.classList.add('slide-out');
            
            setTimeout(() => {
                mainPage.classList.add('hidden');
                mainPage.classList.remove('slide-out');
                
                plansPage.style.display = 'flex';
                plansPage.classList.remove('exit');
                plansPage.classList.add('active');
                tg.expand();
            }, 500);
        }

        function hidePlans() {
            const mainPage = document.getElementById('mainPage');
            const plansPage = document.getElementById('plansPage');
            
            playClickSound();
            
            plansPage.classList.remove('active');
            plansPage.classList.add('exit');
            
            setTimeout(() => {
                plansPage.classList.remove('exit');
                plansPage.style.display = 'none';
                
                mainPage.classList.remove('hidden');
                mainPage.classList.add('slide-in');
                
                setTimeout(() => {
                    mainPage.classList.remove('slide-in');
                }, 600);
                
                tg.expand();
            }, 500);
        }

        // ──────────────────────────────────────────────
        //  4. SHOW/HIDE GAMBLE PAGE
        // ──────────────────────────────────────────────
        function showGamble() {
            const mainPage = document.getElementById('mainPage');
            const gamblePage = document.getElementById('gamblePage');
            
            playClickSound();
            
            mainPage.classList.remove('slide-in');
            mainPage.classList.add('slide-out');
            
            setTimeout(() => {
                mainPage.classList.add('hidden');
                mainPage.classList.remove('slide-out');
                
                gamblePage.classList.add('active');
                tg.expand();
            }, 500);
        }

        function hideGamble() {
            const mainPage = document.getElementById('mainPage');
            const gamblePage = document.getElementById('gamblePage');
            
            playClickSound();
            
            gamblePage.classList.remove('active');
            
            setTimeout(() => {
                gamblePage.style.display = 'none';
                gamblePage.style.display = 'flex';
                
                setTimeout(() => {
                    gamblePage.style.display = '';
                }, 50);
                
                mainPage.classList.remove('hidden');
                mainPage.classList.add('slide-in');
                
                setTimeout(() => {
                    mainPage.classList.remove('slide-in');
                }, 600);
                
                tg.expand();
            }, 400);
        }

        // ──────────────────────────────────────────────
        //  5. DAY/NIGHT MODE TOGGLE
        // ──────────────────────────────────────────────
        let isNightMode = true;

        function toggleTheme() {
            isNightMode = !isNightMode;
            
            document.body.classList.remove('night-mode', 'day-mode');
            
            if (isNightMode) {
                document.body.classList.add('night-mode');
            } else {
                document.body.classList.add('day-mode');
            }
            
            const toggleBtn = document.getElementById('themeToggle');
            const svg = toggleBtn.querySelector('svg');
            
            if (isNightMode) {
                svg.innerHTML = `
                    <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9zm0 16c-3.86 0-7-3.14-7-7s3.14-7 7-7 7 3.14 7 7-3.14 7-7 7z"/>
                    <path d="M12 5v2M12 17v2M5 12H3M7 12H5M19 12h2M17 12h2M7.05 7.05L5.64 5.64M18.36 18.36l-1.41-1.41M16.95 7.05l1.41-1.41M5.64 18.36l1.41-1.41"/>
                    <circle cx="12" cy="12" r="3"/>
                `;
            } else {
                svg.innerHTML = `
                    <path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9-4.03-9-9-9zm0 16c-3.86 0-7-3.14-7-7s3.14-7 7-7 7 3.14 7 7-3.14 7-7 7z"/>
                    <path d="M12 5v2M12 17v2M5 12H3M7 12H5M19 12h2M17 12h2M7.05 7.05L5.64 5.64M18.36 18.36l-1.41-1.41M16.95 7.05l1.41-1.41M5.64 18.36l1.41-1.41"/>
                `;
            }
            
            playToggleSound();
        }

        // ──────────────────────────────────────────────
        //  6. STARS GENERATION
        // ──────────────────────────────────────────────
        function generateStars() {
            const container = document.getElementById('stars');
            const count = 150;
            
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.width = (Math.random() * 3 + 1) + 'px';
                star.style.height = star.style.width;
                star.style.setProperty('--duration', (Math.random() * 3 + 2) + 's');
                star.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(star);
            }
        }
        generateStars();

        // ──────────────────────────────────────────────
        //  7. SOUND EFFECTS
        // ──────────────────────────────────────────────
        function playClickSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.1);
            } catch (e) {}
        }

        function playToggleSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.frequency.value = isNightMode ? 600 : 1000;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
                
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        // ──────────────────────────────────────────────
        //  8. CUSTOM CURSOR
        // ──────────────────────────────────────────────
        const cursor = document.getElementById('customCursor');
        let cursorVisible = true;

        document.addEventListener('mousemove', function(e) {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            cursor.classList.remove('hidden');
            cursorVisible = true;
        });

        document.addEventListener('mouseleave', function() {
            cursor.classList.add('hidden');
            cursorVisible = false;
        });

        document.querySelectorAll('button, a, .magnetic-btn, .theme-toggle, .back-btn, .gamble-back-btn').forEach(el => {
            el.addEventListener('mouseenter', function() {
                cursor.classList.add('hover');
            });
            el.addEventListener('mouseleave', function() {
                cursor.classList.remove('hover');
            });
            el.addEventListener('mousedown', function() {
                cursor.classList.add('click');
            });
            el.addEventListener('mouseup', function() {
                cursor.classList.remove('click');
            });
        });

        // ──────────────────────────────────────────────
        //  9. MAGNETIC BUTTON EFFECT
        // ──────────────────────────────────────────────
        document.querySelectorAll('.magnetic-btn').forEach(btn => {
            btn.addEventListener('mousemove', function(e) {
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                
                const intensity = 16;
                const rotateX = -(y / rect.height) * intensity;
                const rotateY = (x / rect.width) * intensity;
                const scale = 1.04;
                
                this.style.transform = `
                    perspective(600px) 
                    rotateX(${rotateX}deg) 
                    rotateY(${rotateY}deg) 
                    scale(${scale})
                    translateY(-4px)
                `;
                this.style.boxShadow = `
                    0 20px 60px rgba(0,0,0,0.3),
                    0 0 80px rgba(255,255,255,0.05)
                `;
                this.style.transition = 'transform 0.08s ease-out, box-shadow 0.3s ease';
            });
            
            btn.addEventListener('mouseleave', function() {
                this.style.transform = 'perspective(600px) rotateX(0deg) rotateY(0deg) scale(1) translateY(0px)';
                this.style.boxShadow = '';
                this.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease';
            });
        });

        // ──────────────────────────────────────────────
        //  10. MOUSE TRACKING
        // ──────────────────────────────────────────────
        document.addEventListener('mousemove', function(e) {
            const x = (e.clientX / window.innerWidth - 0.5) * 20;
            const y = (e.clientY / window.innerHeight - 0.5) * 20;
            
            const clouds = document.querySelectorAll('.cloud');
            clouds.forEach((cloud, index) => {
                const speed = 0.02 + (index * 0.005);
                cloud.style.transform = `translate(${x * speed}px, ${y * speed}px)`;
            });
        });

        // ──────────────────────────────────────────────
        //  11. DEVICE TILT SUPPORT
        // ──────────────────────────────────────────────
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', function(e) {
                const x = (e.gamma || 0) / 10;
                const y = (e.beta || 0) / 10 - 5;
                
                const clouds = document.querySelectorAll('.cloud');
                clouds.forEach((cloud, index) => {
                    const speed = 0.02 + (index * 0.005);
                    cloud.style.transform = `translate(${x * speed * 2}px, ${y * speed * 2}px)`;
                });
            });
        }

        // ──────────────────────────────────────────────
        //  12. KEYBOARD SHORTCUTS
        // ──────────────────────────────────────────────
        document.addEventListener('keydown', function(e) {
            if (e.key === 'n' || e.key === 'N') {
                toggleTheme();
            }
            if (e.key === 'Escape') {
                if (document.getElementById('plansPage').classList.contains('active')) {
                    hidePlans();
                }
                if (document.getElementById('gamblePage').classList.contains('active')) {
                    hideGamble();
                }
            }
        });

        console.log('✨ Court\'s Website Loaded!');
        console.log('🌙 Night mode is default - Click the toggle button or press "N" to switch');
        console.log('⌨️ Press "ESC" to close Plans or Gamble');
        console.log('🧲 Buttons have enhanced magnetic hover effect!');
        console.log('📱 GitHub buttons link to @thycourt on Telegram');
        console.log('🖱️ Custom cursor: hollow circle');
        console.log('✈️ Gamble button leads to Plane Crash casino game!');
    </script>
