<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Court's</title>
    
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <style>
        /* ─── CUSTOM CURSOR ─── */
        * {
            cursor: none !important;
        }

        .custom-cursor {
            position: fixed;
            pointer-events: none;
            z-index: 99999;
            width: 36px;
            height: 36px;
            transform: translate(-50%, -50%);
            transition: width 0.12s ease, height 0.12s ease, opacity 0.3s ease;
            will-change: transform, left, top;
            background: url('courts.png') no-repeat center center;
            background-size: contain;
            image-rendering: auto;
        }

        .custom-cursor.click {
            width: 24px !important;
            height: 24px !important;
        }

        .custom-cursor.hover {
            width: 44px;
            height: 44px;
            opacity: 0.9;
        }

        .custom-cursor.hidden {
            opacity: 0;
        }

        /* ─── RESET ─── */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
            position: relative;
            background: #0a0a0a;
        }

        /* ─── AMBIENT GLOW ORBS ─── */
        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            z-index: 0;
            background: radial-gradient(ellipse at 30% 50%, rgba(255, 105, 180, 0.08) 0%, transparent 60%),
                        radial-gradient(ellipse at 70% 80%, rgba(255, 20, 147, 0.05) 0%, transparent 50%);
            animation: ambientDrift 25s ease-in-out infinite alternate;
            opacity: 0.6;
        }

        @keyframes ambientDrift {
            0% { transform: translate(0%, 0%) rotate(0deg) scale(1); }
            50% { transform: translate(3%, 2%) rotate(2deg) scale(1.05); }
            100% { transform: translate(-2%, 4%) rotate(-2deg) scale(0.95); }
        }

        /* ─── MAIN PAGE ─── */
        #mainPage {
            position: relative;
            z-index: 2;
            border-radius: 48px;
            padding: 60px 40px 40px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            display: block;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(80px);
            -webkit-backdrop-filter: blur(80px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 50px 100px -30px rgba(0, 0, 0, 0.4),
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        #mainPage.hidden {
            display: none;
        }

        #mainPage.slide-out {
            animation: mainSlideOut 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        #mainPage.slide-in {
            animation: mainSlideIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes mainSlideOut {
            0% { opacity: 1; transform: scale(1) translateY(0); }
            100% { opacity: 0; transform: scale(0.95) translateY(-20px); }
        }

        @keyframes mainSlideIn {
            0% { opacity: 0; transform: scale(0.95) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* ─── TYPEWRITER TITLE ─── */
        .title-wrapper {
            min-height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 30px;
        }

        #typewriter {
            font-size: 3rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -1.5px;
            line-height: 1.1;
            position: relative;
            text-shadow: 0 0 60px rgba(255, 255, 255, 0.1);
        }

        #typewriter .cursor {
            display: inline-block;
            width: 4px;
            height: 0.8em;
            margin-left: 6px;
            border-radius: 2px;
            background: linear-gradient(180deg, #ff69b4, #ff1493);
            box-shadow: 0 0 30px rgba(255, 105, 180, 0.2);
            animation: blink 0.8s step-end infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* ─── BUTTON WRAPPER ─── */
        .btn-wrapper {
            position: relative;
            display: inline-block;
            width: 100%;
            margin-bottom: 10px;
        }

        .btn-wrapper:last-of-type {
            margin-bottom: 0;
        }

        /* ─── MAGNETIC BUTTON EFFECT ─── */
        .magnetic-btn {
            transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.3s ease,
                        background 0.3s ease;
            will-change: transform;
            position: relative;
            z-index: 1;
        }

        .magnetic-btn::after {
            content: '';
            position: absolute;
            inset: -8px;
            border-radius: 68px;
            background: rgba(255, 255, 255, 0);
            filter: blur(20px);
            transition: all 0.4s ease;
            z-index: -1;
            pointer-events: none;
        }

        .magnetic-btn:hover::after {
            background: rgba(255, 255, 255, 0.05);
            filter: blur(30px);
            transform: scale(1.1);
        }

        /* ─── MERCHANDISE BUTTON ─── */
        .btn-merch {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 40px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #2b2b2b, #1a1a1a, #0d0d0d, #2b2b2b);
            background-size: 300% 300%;
            border: none;
            border-radius: 60px;
            cursor: none !important;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                        background-position 8s ease-in-out;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
            letter-spacing: 0.5px;
            overflow: hidden;
            animation: merchGradient 8s ease-in-out infinite;
            width: 100%;
            will-change: transform;
        }

        @keyframes merchGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn-merch::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 63px;
            background: linear-gradient(135deg, rgba(43, 43, 43, 0.5), rgba(13, 13, 13, 0.5));
            filter: blur(20px);
            opacity: 0;
            transition: all 0.6s ease;
            z-index: -1;
        }

        .btn-merch:hover::before {
            opacity: 1;
            filter: blur(25px);
            animation: pulseGlow 1.5s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .btn-merch::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 60px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.1), transparent 50%, rgba(255, 255, 255, 0.03));
            pointer-events: none;
        }

        .btn-merch:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                        0 0 80px rgba(0, 0, 0, 0.2);
            animation-play-state: paused;
        }

        .btn-merch:active {
            transform: scale(0.94) translateY(0px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            transition-duration: 0.1s;
        }

        .merch-icon {
            width: 32px;
            height: 32px;
            display: block;
            transition: transform 0.3s ease;
            flex-shrink: 0;
            border-radius: 50%;
            background: url('courts2.png') no-repeat center center;
            background-size: contain;
            image-rendering: auto;
        }

        .btn-merch:hover .merch-icon {
            transform: scale(1.1) rotate(-5deg);
        }

        /* ─── DISCORD BUTTON ─── */
        .btn-discord {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 40px;
            font-size: 1rem;
            font-weight: 600;
            color: #ffffff;
            background: linear-gradient(135deg, #5865F2, #4752C4, #3B45A5, #5865F2);
            background-size: 300% 300%;
            border: none;
            border-radius: 60px;
            cursor: none !important;
            text-decoration: none;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
                        background-position 8s ease-in-out;
            box-shadow: 0 8px 30px rgba(88, 101, 242, 0.4);
            letter-spacing: 0.5px;
            overflow: hidden;
            animation: discordGradient 8s ease-in-out infinite;
            width: 100%;
            will-change: transform;
        }

        @keyframes discordGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn-discord::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 63px;
            background: linear-gradient(135deg, rgba(88, 101, 242, 0.5), rgba(59, 69, 165, 0.5));
            filter: blur(20px);
            opacity: 0;
            transition: all 0.6s ease;
            z-index: -1;
        }

        .btn-discord:hover::before {
            opacity: 1;
            filter: blur(25px);
            animation: pulseGlow 1.5s ease-in-out infinite;
        }

        .btn-discord::after {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 60px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), transparent 50%, rgba(255, 255, 255, 0.05));
            pointer-events: none;
        }

        .btn-discord:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 20px 50px rgba(88, 101, 242, 0.5),
                        0 0 80px rgba(88, 101, 242, 0.2);
            animation-play-state: paused;
        }

        .btn-discord:active {
            transform: scale(0.94) translateY(0px);
            box-shadow: 0 4px 20px rgba(88, 101, 242, 0.2);
            transition-duration: 0.1s;
        }

        .discord-icon {
            width: 24px;
            height: 24px;
            fill: #ffffff;
            display: block;
            transition: transform 0.3s ease;
            flex-shrink: 0;
        }

        .btn-discord:hover .discord-icon {
            transform: scale(1.1) rotate(-5deg);
        }

        /* ─── BUTTONS CONTAINER ─── */
        .buttons-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        /* ─── PLANS PAGE ─── */
        #plansPage {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 100;
            overflow-y: auto;
            padding: 40px 20px;
            justify-content: center;
            align-items: flex-start;
            background: #0a0a0a;
        }

        #plansPage.active {
            display: flex;
            animation: pageSlideIn 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        #plansPage.exit {
            animation: pageSlideOut 0.5s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        @keyframes pageSlideIn {
            0% { opacity: 0; transform: scale(0.95) translateY(20px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        @keyframes pageSlideOut {
            0% { opacity: 1; transform: scale(1) translateY(0); }
            100% { opacity: 0; transform: scale(0.95) translateY(20px); }
        }

        .plans-container {
            position: relative;
            z-index: 2;
            max-width: 900px;
            width: 100%;
            padding: 40px 30px;
        }

        .plans-title {
            font-size: 3rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 50px;
            letter-spacing: -1.5px;
            background: linear-gradient(135deg, #ffb6c1, #ff69b4, #ff1493, #ff69b4);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: titleGradient 4s ease-in-out infinite;
        }

        @keyframes titleGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .plans-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
            margin-bottom: 30px;
        }

        .plan-box {
            border-radius: 32px;
            padding: 40px 30px 30px;
            text-align: center;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1),
                        box-shadow 0.4s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 160px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 60px -20px rgba(0, 0, 0, 0.3),
                        inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        .plan-box:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.4);
        }

        .plan-box h3 {
            font-size: 1.3rem;
            font-weight: 600;
            color: #ffffff;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 20px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
        }

        .plan-icon {
            width: 48px;
            height: 48px;
            display: block;
            flex-shrink: 0;
            border-radius: 50%;
            background: url('courts2.png') no-repeat center center;
            background-size: contain;
            image-rendering: auto;
        }

        .plan-box .btn-github {
            width: 100%;
            padding: 14px 24px;
            font-size: 0.95rem;
            background: linear-gradient(135deg, #2b2b2b, #1a1a1a, #0d0d0d, #2b2b2b);
            background-size: 300% 300%;
            animation: githubGradient 8s ease-in-out infinite;
            border: none;
            border-radius: 60px;
            color: #ffffff;
            font-weight: 600;
            cursor: none !important;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            margin-top: auto;
            flex-shrink: 0;
            font-family: 'Inter', sans-serif;
            will-change: transform;
        }

        @keyframes githubGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .plan-box .btn-github::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 63px;
            background: linear-gradient(135deg, rgba(43, 43, 43, 0.5), rgba(13, 13, 13, 0.5));
            filter: blur(15px);
            opacity: 0;
            transition: all 0.6s ease;
            z-index: -1;
        }

        .plan-box .btn-github:hover::before {
            opacity: 1;
            filter: blur(20px);
        }

        .plan-box .btn-github:hover {
            transform: scale(1.05) translateY(-3px);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .plan-box .btn-github:active {
            transform: scale(0.94);
        }

        .plan-box .btn-github .github-icon {
            width: 20px;
            height: 20px;
            fill: #ffffff;
        }

        .plan-box .btn-github .strikethrough {
            text-decoration: line-through;
            text-decoration-color: #ff4444;
            text-decoration-thickness: 2px;
            margin-right: 4px;
            opacity: 0.7;
        }

        /* ─── BACK BUTTON ─── */
        .back-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 32px;
            font-size: 0.95rem;
            font-weight: 500;
            border-radius: 60px;
            cursor: none !important;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            margin: 0 auto;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 300px;
            will-change: transform;
            color: rgba(255, 255, 255, 0.7);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        .back-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        .back-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            margin-top: 10px;
        }

        /* ─── RESPONSIVE ─── */
        @media (max-width: 480px) {
            #mainPage {
                padding: 40px 20px 30px;
                border-radius: 32px;
                background: rgba(255, 255, 255, 0.06);
                backdrop-filter: blur(60px);
                -webkit-backdrop-filter: blur(60px);
                max-width: 100%;
            }

            #typewriter {
                font-size: 2.2rem;
            }

            .title-wrapper {
                min-height: 60px;
                margin-bottom: 20px;
            }

            .btn-merch, .btn-discord {
                padding: 12px 20px;
                font-size: 0.9rem;
                gap: 8px;
            }

            .merch-icon {
                width: 28px;
                height: 28px;
            }

            .discord-icon {
                width: 20px;
                height: 20px;
            }

            .plans-title {
                font-size: 2rem;
            }

            .plans-grid {
                grid-template-columns: 1fr;
            }

            .plan-box {
                padding: 30px 20px 20px;
                min-height: 130px;
            }

            .plan-box h3 {
                font-size: 1.1rem;
                min-height: 40px;
                margin-bottom: 15px;
            }

            .plan-icon {
                width: 40px;
                height: 40px;
            }

            .plans-container {
                padding: 20px 15px;
            }

            .back-btn {
                padding: 10px 24px;
                font-size: 0.85rem;
                max-width: 100%;
            }

            .back-row {
                gap: 10px;
            }

            .custom-cursor {
                display: none !important;
            }
        }

        @media (max-width: 380px) {
            #typewriter {
                font-size: 1.8rem;
            }
            .btn-merch, .btn-discord {
                padding: 10px 16px;
                font-size: 0.8rem;
                gap: 6px;
            }
            .merch-icon {
                width: 24px;
                height: 24px;
            }
            .discord-icon {
                width: 18px;
                height: 18px;
            }

            .plans-title {
                font-size: 1.6rem;
            }

            .plan-icon {
                width: 36px;
                height: 36px;
            }

            .custom-cursor {
                display: none !important;
            }
        }

        /* ─── HIDE CUSTOM CURSOR ON TOUCH DEVICES ─── */
        @media (hover: none) and (pointer: coarse) {
            .custom-cursor {
                display: none !important;
            }
            * {
                cursor: auto !important;
            }
        }
    

/* UI grid repair */
.button-grid, .buttons-grid, .button-container, .buttons, .links, .link-grid {
    display: grid !important;
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 14px !important;
    width: 100%;
}
.button-grid > *, .buttons-grid > *, .button-container > *, .buttons > *, .links > *, .link-grid > * {
    width: 100% !important;
    min-width: 0;
}
@media (max-width: 520px) {
    .button-grid, .buttons-grid, .button-container, .buttons, .links, .link-grid {
        grid-template-columns: 1fr !important;
    }
}

</style>
</head>
<body>

    <!-- ─── CUSTOM CURSOR ─── -->
    <div class="custom-cursor" id="customCursor"></div>

    <!-- ─── MAIN PAGE ─── -->
    <div id="mainPage">

        <!-- Typewriter Title -->
        <div class="title-wrapper">
            <h1 id="typewriter">
                <span id="typed-text"></span><span class="cursor"></span>
            </h1>
        </div>

        <!-- Buttons Container -->
        <div class="buttons-container">
            <div class="btn-wrapper">
                <button class="btn-merch magnetic-btn" onclick="showPlans()" id="viewPlansBtn">
                    <span class="merch-icon"></span>
                    Merchandise
                </button>
            </div>

            <div class="btn-wrapper">
                <a href="https://discord.gg/8qCDcjFH7c" class="btn-discord magnetic-btn" target="_blank" id="discordBtn">
                    <svg class="discord-icon" viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg">

                    </svg>
                    Discord
                </a>
            </div>

    <script>
        // ──────────────────────────────────────────────
        //  1. TELEGRAM MINI APP INIT
        // ──────────────────────────────────────────────
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        // ──────────────────────────────────────────────
        //  2. TYPEWRITER EFFECT
        // ──────────────────────────────────────────────
        const textElement = document.getElementById('typed-text');
        const words = ['Court\'s'];
        let wordIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        let speed = 200;

        function typeEffect() {
            const currentWord = words[wordIndex];
            const currentText = textElement.textContent;

            if (!isDeleting) {
                textElement.textContent = currentWord.substring(0, charIndex + 1);
                charIndex++;

                if (charIndex === currentWord.length) {
                    isDeleting = true;
                    speed = 2000;
                    setTimeout(() => { speed = 100; }, 2000);
                }
            } else {
                textElement.textContent = currentWord.substring(0, charIndex - 1);
                charIndex--;

                if (charIndex === 0) {
                    isDeleting = false;
                    wordIndex = (wordIndex + 1) % words.length;
                    speed = 150;
                }
            }

            setTimeout(typeEffect, speed);
        }

        setTimeout(typeEffect, 300);

        // ──────────────────────────────────────────────
        //  3. SHOW/HIDE PLANS PAGE
        // ──────────────────────────────────────────────
        function showPlans() {
            const mainPage = document.getElementById('mainPage');
            const plansPage = document.getElementById('plansPage');
            
            playClickSound();
            
            mainPage.classList.remove('slide-in');
            mainPage.classList.add('slide-out');
            
            setTimeout(() => {
                mainPage.classList.add('hidden');
                mainPage.classList.remove('slide-out');
                
                plansPage.style.display = 'flex';
                plansPage.classList.remove('exit');
                plansPage.classList.add('active');
                tg.expand();
            }, 500);
        }

        function hidePlans() {
            const mainPage = document.getElementById('mainPage');
            const plansPage = document.getElementById('plansPage');
            
            playClickSound();
            
            plansPage.classList.remove('active');
            plansPage.classList.add('exit');
            
            setTimeout(() => {
                plansPage.classList.remove('exit');
                plansPage.style.display = 'none';
                
                mainPage.classList.remove('hidden');
                mainPage.classList.add('slide-in');
                
                setTimeout(() => {
                    mainPage.classList.remove('slide-in');
                }, 600);
                
                tg.expand();
            }, 500);
        }

        // ──────────────────────────────────────────────
        //  4. SOUND EFFECTS
        // ──────────────────────────────────────────────
        function playClickSound() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                
                oscillator.frequency.value = 800;
                oscillator.type = 'sine';
                
                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.1);
            } catch (e) {}
        }

        // ──────────────────────────────────────────────
        //  5. CUSTOM CURSOR
        // ──────────────────────────────────────────────
        const cursor = document.getElementById('customCursor');

        document.addEventListener('mousemove', function(e) {
            cursor.style.left = e.clientX + 'px';
            cursor.style.top = e.clientY + 'px';
            cursor.classList.remove('hidden');
        });

        document.addEventListener('mouseleave', function() {
            cursor.classList.add('hidden');
        });

        document.querySelectorAll('button, a, .magnetic-btn, .back-btn').forEach(el => {
            if (!el) return;
            el.addEventListener('mouseenter', function() {
                cursor.classList.add('hover');
            });
            el.addEventListener('mouseleave', function() {
                cursor.classList.remove('hover');
            });
            el.addEventListener('mousedown', function() {
                cursor.classList.add('click');
                setTimeout(() => {
                    cursor.classList.remove('click');
                }, 150);
            });
        });

        // ──────────────────────────────────────────────
        //  6. MAGNETIC BUTTON EFFECT
        // ──────────────────────────────────────────────
        document.querySelectorAll('.magnetic-btn').forEach(btn => {
            btn.addEventListener('mousemove', function(e) {
                const rect = this.getBoundingClientRect();
                const x = e.clientX - rect.left - rect.width / 2;
                const y = e.clientY - rect.top - rect.height / 2;
                
                const intensity = 16;
                const rotateX = -(y / rect.height) * intensity;
                const rotateY = (x / rect.width) * intensity;
                const scale = 1.04;
                
                this.style.transform = `
                    perspective(600px) 
                    rotateX(${rotateX}deg) 
                    rotateY(${rotateY}deg) 
                    scale(${scale})
                    translateY(-4px)
                `;
                this.style.boxShadow = `
                    0 20px 60px rgba(0,0,0,0.3),
                    0 0 80px rgba(255,255,255,0.05)
                `;
                this.style.transition = 'transform 0.08s ease-out, box-shadow 0.3s ease';
            });
            
            btn.addEventListener('mouseleave', function() {
                this.style.transform = 'perspective(600px) rotateX(0deg) rotateY(0deg) scale(1) translateY(0px)';
                this.style.boxShadow = '';
                this.style.transition = 'transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.4s ease';
            });
        });

        // ──────────────────────────────────────────────
        //  7. KEYBOARD SHORTCUTS
        // ──────────────────────────────────────────────
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                if (document.getElementById('plansPage').classList.contains('active')) {
                    hidePlans();
                }
            }
        });

        console.log('✨ Court\'s Website Loaded!');
        console.log('🖤 Black theme with pink accents');
        console.log('🖱️ Custom cursor: courts.png');
        console.log('⌨️ Press "ESC" to close Merch');
    </script>


<script>
(() => {
  const repairButtonGrids = () => {
    document.querySelectorAll('button, a').forEach((el) => {
      const parent = el.parentElement;
      if (!parent) return;
      const actions = [...parent.children].filter((child) =>
        child.matches('button, a') && child.offsetParent !== null
      );
      if (actions.length >= 2) {
        parent.style.display = 'grid';
        parent.style.gridTemplateColumns = 'repeat(2, minmax(0, 1fr))';
        parent.style.gap = '14px';
        actions.forEach((child) => child.style.width = '100%');
      }
    });
  };
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', repairButtonGrids);
  } else {
    repairButtonGrids();
  }
})();
</script>
