<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Cleetus</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    min-height: 100vh;
    font-family: Verdana, Tahoma, Arial, sans-serif;
    font-size: 11px;
    background: #F5F5F0;
    overflow-x: hidden;
}

body {
    padding: 0;
    cursor: none;
    -webkit-tap-highlight-color: transparent;
    color: #000000;
}

a, button, input {
    cursor: none;
    font-family: Verdana, Tahoma, Arial, sans-serif;
}

@media (hover: none), (pointer: coarse) {
    body, a, button, input { cursor: auto; }
    .custom-cursor { display: none !important; }
}

/* ─── CURSOR ─── */
.custom-cursor {
    position: fixed;
    top: 0;
    left: 0;
    width: 24px;
    height: 24px;
    margin-left: -12px;
    margin-top: -12px;
    pointer-events: none;
    z-index: 999999;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M4 2 L4 24 L10 18 L14 28 L18 26 L14 16 L22 16 Z' fill='%23FFFFFF' stroke='%23000' stroke-width='1.4' stroke-linejoin='round'/></svg>") no-repeat center;
    background-size: contain;
}

.custom-cursor.hover { filter: drop-shadow(0 0 3px #0000CC); }
.custom-cursor.click { width: 18px; height: 18px; margin-left: -9px; margin-top: -9px; }

/* ─── BANNER ─── */
.banner-wrap {
    width: 100%;
    background: #F5F5F0;
    text-align: center;
    padding: 0;
    border-bottom: 1px solid #C8C8C0;
}

.banner-wrap img {
    display: block;
    width: 100%;
    max-width: 2172px;
    height: auto;
    margin: 0 auto;
}

/* ─── LAYOUT ─── */
.page-wrap {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px 14px 40px;
    background: #F5F5F0;
    min-height: 100vh;
}

/* ─── HEADER ─── */
.header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 10px 4px 12px;
    border-bottom: 1px solid #C8C8C0;
    margin-bottom: 12px;
}

#typewriter {
    font-family: 'Times New Roman', Times, serif;
    font-size: 2.2rem;
    font-weight: bold;
    color: #000000;
    letter-spacing: 0.5px;
    min-height: 1.2em;
    line-height: 1.2;
}

#typed-text { color: #000000; }

#typewriter .cursor {
    display: inline-block;
    width: 3px;
    height: 0.85em;
    margin-left: 2px;
    background: #000000;
    animation: blink 0.9s step-end infinite;
    vertical-align: middle;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0; }
}

.header-right {
    font-size: 10px;
    color: #666666;
    text-align: right;
}

.header-right a {
    color: #0000CC;
    text-decoration: underline;
}

/* ─── LINK BAR ─── */
.link-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 6px 18px;
    padding: 8px 0 10px;
    border-bottom: 1px solid #C8C8C0;
    margin-bottom: 12px;
}

.link-bar a {
    color: #0000CC;
    text-decoration: underline;
    font-size: 11px;
    font-weight: bold;
    text-transform: uppercase;
    letter-spacing: 0.3px;
}

.link-bar a:hover { color: #CC0000; }

/* ─── MAIN LAYOUT ─── */
.main-grid {
    display: grid;
    grid-template-columns: 200px 1fr 200px;
    gap: 12px;
}

@media (max-width: 800px) {
    .main-grid {
        grid-template-columns: 1fr;
    }
}

/* ─── SIDEBAR BOXES ─── */
.box {
    background: #FFFFFF;
    border: 1px solid #B0B0A8;
    margin-bottom: 10px;
}

.box-title {
    background: #E8E4D8;
    border-bottom: 1px solid #B0B0A8;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: bold;
    color: #000000;
}

.box-body {
    padding: 8px 10px;
    font-size: 11px;
    line-height: 1.5;
    color: #333333;
}

.box-body a {
    color: #0000CC;
    text-decoration: underline;
}

.box-body a:hover { color: #CC0000; }

/* ─── CENTER COLUMN ─── */
.center-col {
    background: #FFFFFF;
    border: 1px solid #B0B0A8;
    padding: 12px 14px;
}

.center-title {
    font-size: 12px;
    font-weight: bold;
    color: #000000;
    padding-bottom: 6px;
    border-bottom: 1px solid #E0E0D8;
    margin-bottom: 10px;
}

.link-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 4px 20px;
    margin-bottom: 14px;
}

.link-grid a {
    color: #0000CC;
    text-decoration: underline;
    font-size: 11px;
    line-height: 1.6;
}

.link-grid a:hover { color: #CC0000; }

/* ─── ESP11 BOX ─── */
.esp-main {
    background: #FFFFFF;
    border: 1px solid #B0B0A8;
    padding: 10px 14px;
    margin-top: 10px;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.esp-main .name {
    font-family: Verdana, Tahoma, Arial, sans-serif;
    font-size: 12px;
    font-weight: bold;
    color: #000000;
    letter-spacing: 0.5px;
}

.esp-main .status {
    font-family: Verdana, Tahoma, Arial, sans-serif;
    font-size: 12px;
    font-weight: bold;
    color: #008000;
    letter-spacing: 0.5px;
}

/* ─── BUTTONS ROW ─── */
.btn-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dotted #C8C8C0;
}

.btn-discord {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    padding: 4px 14px;
    background: #D4D0C8;
    border-top: 1px solid #FFFFFF;
    border-left: 1px solid #FFFFFF;
    border-right: 1px solid #808080;
    border-bottom: 1px solid #808080;
    font-family: Verdana, Tahoma, Arial, sans-serif;
    font-size: 11px;
    font-weight: bold;
    color: #000000;
    text-decoration: none;
    letter-spacing: 0.3px;
}

.btn-discord:hover { background: #E0DCD0; color: #0000CC; }

.btn-discord:active {
    border-top: 1px solid #808080;
    border-left: 1px solid #808080;
    border-right: 1px solid #FFFFFF;
    border-bottom: 1px solid #FFFFFF;
}

.discord-icon {
    width: 12px;
    height: 12px;
    fill: #5865F2;
    flex-shrink: 0;
}

/* ─── DOWNLOAD PAGE ─── */
.download-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 14px;
    background: #FFFFFF;
    border: 1px solid #B0B0A8;
    margin-bottom: 8px;
}

.download-item a {
    color: #0000CC;
    text-decoration: underline;
    font-size: 12px;
    font-weight: bold;
}

.download-item a:hover { color: #CC0000; }

/* ─── FOOTER ─── */
.footer {
    margin-top: 24px;
    padding: 12px 4px;
    border-top: 1px solid #C8C8C0;
    font-size: 10px;
    color: #888888;
    text-align: center;
    line-height: 1.6;
}

.footer a {
    color: #0000CC;
    text-decoration: underline;
}

/* ─── MOBILE ─── */
@media (max-width: 480px) {
    html, body { font-size: 10px; }
    .page-wrap { padding: 12px 8px 30px; }
    #typewriter { font-size: 1.6rem; }
    .link-grid { grid-template-columns: 1fr; }
}


/* UI grid repair */
.button-grid, .buttons-grid, .button-container, .buttons, .links, .link-grid {
    display: grid !important;
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 14px !important;
    width: 100%;
}
.button-grid > *, .buttons-grid > *, .button-container > *, .buttons > *, .links > *, .link-grid > * {
    width: 100% !important;
    min-width: 0;
}
@media (max-width: 520px) {
    .button-grid, .buttons-grid, .button-container, .buttons, .links, .link-grid {
        grid-template-columns: 1fr !important;
    }
}

</style>
</head>
<body>

<div class="custom-cursor" id="customCursor"></div>

<!-- BANNER -->
<div class="banner-wrap">
    <img src="banner.png" alt="Cleetus Banner" />
</div>

<!-- MAIN PAGE -->
<div id="mainPage">

        <!-- HEADER -->
        <div class="header">

                <span id="typed-text"></span><span class="cursor"></span>
            </h1>
            <div class="header-right">

        <div class="link-bar">

        <!-- MAIN GRID -->
        <div class="main-grid">

            <div class="left-col">

                            <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S53.9,46,53.9,53,48.77,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.21,60,73.21,53s5-12.74,11.44-12.74S96.12,46,96.12,53,91,65.69,84.69,65.69Z"/>

    <div class="page-wrap">

        <!-- HEADER -->
        <div class="header">
            <h1 style="font-family:'Times New Roman',Times,serif;font-size:2.2rem;font-weight:bold;color:#000;min-height:1.2em;line-height:1.2;">

            <a href="https://github.com/JKAnderson/DSR-Gadget" target="_blank" rel="noopener">DSR-Gadget</a>
        </div>

        <!-- FOOTER -->
        <div class="footer">
            <a href="#">Terms of Service</a>
        </div>

</div>

<script>
try {
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
} catch (e) {}

function $(id) { return document.getElementById(id); }

/* ─── TYPEWRITER (just "Cleetus") ─── */
(function typewriter() {
    var target = $('typed-text');
    if (!target) return;
    var word = 'Cleetus';
    var idx = 0;
    var deleting = false;
    var speed = 160;

    function step() {
        if (!deleting) {
            target.textContent = word.substring(0, idx + 1);
            idx++;
            if (idx === word.length) {
                deleting = true;
                speed = 2400;
                setTimeout(function () { speed = 90; }, 2400);
            }
        } else {
            target.textContent = word.substring(0, idx - 1);
            idx--;
            if (idx === 0) {
                deleting = false;
                speed = 140;
            }
        }
        setTimeout(step, speed);
    }
    step();
})();

/* ─── PAGE NAVIGATION ─── */
function showDownload() {
    $('mainPage').style.display = 'none';
    $('downloadPage').style.display = 'block';
    try { window.Telegram.WebApp.expand(); } catch (e) {}
}

function hideDownload() {
    $('downloadPage').style.display = 'none';
    $('mainPage').style.display = 'block';
    try { window.Telegram.WebApp.expand(); } catch (e) {}
}

function bindAll() {
    var dl = $('downloadLink');
    var bk = $('backLink');
    if (dl && !dl.dataset.bound) { dl.addEventListener('click', function (e) { e.preventDefault(); showDownload(); }); dl.dataset.bound = '1'; }
    if (bk && !bk.dataset.bound) { bk.addEventListener('click', function (e) { e.preventDefault(); hideDownload(); }); bk.dataset.bound = '1'; }
}
document.addEventListener('DOMContentLoaded', bindAll);
setTimeout(bindAll, 0);

/* ─── CURSOR ─── */
(function () {
    var cursor = $('customCursor');
    if (!cursor) return;
    var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    if (isTouch) { cursor.style.display = 'none'; return; }

    document.addEventListener('mousemove', function (e) {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
        cursor.style.opacity = '1';
    });
    document.addEventListener('mouseleave', function () { cursor.style.opacity = '0'; });

    document.addEventListener('mouseover', function (e) {
        if (e.target.closest('button, a, input')) cursor.classList.add('hover');
    });
    document.addEventListener('mouseout', function (e) {
        if (e.target.closest('button, a, input')) cursor.classList.remove('hover');
    });
    document.addEventListener('mousedown', function () { cursor.classList.add('click'); });
    document.addEventListener('mouseup', function () { cursor.classList.remove('click'); });
})();
</script>


<script>
(() => {
  const repairButtonGrids = () => {
    document.querySelectorAll('button, a').forEach((el) => {
      const parent = el.parentElement;
      if (!parent) return;
      const actions = [...parent.children].filter((child) =>
        child.matches('button, a') && child.offsetParent !== null
      );
      if (actions.length >= 2) {
        parent.style.display = 'grid';
        parent.style.gridTemplateColumns = 'repeat(2, minmax(0, 1fr))';
        parent.style.gap = '14px';
        actions.forEach((child) => child.style.width = '100%');
      }
    });
  };
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', repairButtonGrids);
  } else {
    repairButtonGrids();
  }
})();
</script>

</body>
