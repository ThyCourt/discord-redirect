<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Cleetus Drop</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    min-height: 100vh;
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    background: #0a1220;
    overflow-x: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    position: relative;
    cursor: none;
    -webkit-tap-highlight-color: transparent;
}

a, button, input, .case-image {
    cursor: none;
}

@media (hover: none), (pointer: coarse) {
    body, a, button, input { cursor: auto; }
    .custom-cursor { display: none !important; }
}

body::before {
    content: '';
    position: fixed;
    inset: -20%;
    z-index: 0;
    background:
        radial-gradient(circle at var(--mx, 30%) var(--my, 50%), rgba(0, 140, 255, 0.35) 0%, transparent 40%),
        radial-gradient(circle at calc(100% - var(--mx, 30%)) calc(100% - var(--my, 50%)), rgba(80, 200, 255, 0.25) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(10, 30, 80, 0.9) 0%, #050812 80%);
    animation: bgBreath 10s ease-in-out infinite alternate;
    pointer-events: none;
}

@keyframes bgBreath {
    0%   { transform: scale(1); }
    100% { transform: scale(1.06); }
}

body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    background: linear-gradient(115deg,
        transparent 20%,
        rgba(0, 140, 255, 0.06) 35%,
        rgba(120, 220, 255, 0.12) 45%,
        rgba(0, 140, 255, 0.06) 55%,
        transparent 70%);
    background-size: 300% 300%;
    animation: auroraSweep 12s linear infinite;
    pointer-events: none;
    mix-blend-mode: screen;
}

@keyframes auroraSweep {
    0%   { background-position: 0% 0%; }
    100% { background-position: 200% 100%; }
}

/* ─── CURSOR ─── */
.custom-cursor {
    position: fixed;
    top: 0;
    left: 0;
    width: 32px;
    height: 32px;
    margin-left: -16px;
    margin-top: -16px;
    pointer-events: none;
    z-index: 999999;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='b' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='%23FFFFFF'/><stop offset='100%' stop-color='%23E0E0E0'/></linearGradient></defs><path d='M4 2 L4 24 L10 18 L14 28 L18 26 L14 16 L22 16 Z' fill='url(%23b)' stroke='%23000' stroke-width='1.2' stroke-linejoin='round'/></svg>") no-repeat center;
    background-size: contain;
    transition: width 0.15s ease, height 0.15s ease, margin 0.15s ease, filter 0.3s ease;
    will-change: transform;
}

.custom-cursor.hover {
    width: 42px;
    height: 42px;
    margin-left: -21px;
    margin-top: -21px;
    filter: drop-shadow(0 0 14px rgba(120, 200, 255, 1));
}

.custom-cursor.click {
    width: 22px;
    height: 22px;
    margin-left: -11px;
    margin-top: -11px;
}

/* ─── MAIN WINDOW ─── */
#mainPage {
    position: relative;
    z-index: 2;
    border-radius: 10px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    background: #ECE9D8;
    border: 3px solid #0054E3;
    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.6),
        0 0 80px rgba(0, 140, 255, 0.5),
        0 0 140px rgba(0, 140, 255, 0.25),
        inset 0 0 0 1px rgba(255, 255, 255, 0.5);
    overflow: hidden;
    animation: windowGlow 5s ease-in-out infinite alternate;
}

@keyframes windowGlow {
    0% {
        box-shadow:
            0 20px 60px rgba(0, 0, 0, 0.6),
            0 0 60px rgba(0, 140, 255, 0.4),
            0 0 100px rgba(0, 140, 255, 0.2),
            inset 0 0 0 1px rgba(255, 255, 255, 0.5);
    }
    100% {
        box-shadow:
            0 25px 70px rgba(0, 0, 0, 0.7),
            0 0 120px rgba(0, 140, 255, 0.7),
            0 0 200px rgba(0, 140, 255, 0.4),
            inset 0 0 0 1px rgba(255, 255, 255, 0.5);
    }
}

.main-content {
    padding: 50px 40px 45px;
}

/* ─── TYPEWRITER ─── */
.title-wrapper {
    min-height: 80px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 30px;
}

#typewriter {
    font-size: 2.5rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.1;
    font-family: 'Tahoma', sans-serif;
    color: #0A246A;
    min-height: 1.1em;
    min-width: 1ch;
}

#typed-text {
    background: linear-gradient(180deg, #0A246A, #0088FF, #0A246A);
    background-size: 100% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: titleGradientShift 4s ease-in-out infinite;
}

@keyframes titleGradientShift {
    0%, 100% { background-position: 0% 0%; }
    50%      { background-position: 0% 100%; }
}

#typewriter .cursor {
    display: inline-block;
    width: 3px;
    height: 0.8em;
    margin-left: 4px;
    background: #0088FF;
    box-shadow: 0 0 14px rgba(0, 140, 255, 1);
    animation: blink 0.8s step-end infinite;
    vertical-align: middle;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0; }
}

/* ─── BUTTONS ─── */
.buttons-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
}

.btn-wrapper {
    display: flex;
    justify-content: center;
    width: 100%;
}

.btn-merch,
.btn-discord {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    height: 54px;
    padding: 0 26px;
    font-size: 0.92rem;
    font-weight: 700;
    color: #000;
    border: 2px outset #ECE9D8;
    border-radius: 6px;
    text-decoration: none;
    letter-spacing: 0.6px;
    overflow: hidden;
    width: 260px;
    max-width: 100%;
    font-family: 'Tahoma', sans-serif;
    background: linear-gradient(180deg, #FFFFFF, #E8E4D8 45%, #D4D0C8);
    box-shadow:
        1px 1px 0 #FFFFFF inset,
        -1px -1px 0 #808080 inset,
        0 4px 12px rgba(0, 0, 0, 0.25);
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

.btn-merch::before,
.btn-discord::before {
    content: '';
    position: absolute;
    top: 0;
    left: -120%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
    transition: left 0.9s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 1;
}

.btn-merch:hover::before,
.btn-discord:hover::before { left: 120%; }

.btn-merch:hover,
.btn-discord:hover {
    background: linear-gradient(180deg, #FFFFFF, #F4F0E2 45%, #E4E0D0);
    transform: translateY(-5px) scale(1.06);
    border-color: #00A8FF;
    box-shadow:
        1px 1px 0 #FFFFFF inset,
        -1px -1px 0 #808080 inset,
        0 14px 32px rgba(0, 140, 255, 0.55),
        0 0 60px rgba(0, 180, 255, 0.5);
}

.btn-merch:active,
.btn-discord:active {
    border: 2px inset #ECE9D8;
    transform: translateY(-1px) scale(0.96);
    box-shadow:
        -1px -1px 0 #FFFFFF inset,
        1px 1px 0 #808080 inset,
        0 2px 6px rgba(0, 0, 0, 0.4);
}

.btn-text { position: relative; z-index: 2; }

.discord-icon {
    width: 22px;
    height: 22px;
    fill: #5865F2;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    flex-shrink: 0;
    position: relative;
    z-index: 2;
}

.btn-discord:hover .discord-icon {
    transform: scale(1.3) rotate(-12deg);
    filter: drop-shadow(0 0 8px rgba(88, 101, 242, 1));
}

/* ─── CASES PAGE ─── */
#casesPage {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    overflow-y: auto;
    padding: 40px 20px;
    justify-content: center;
    align-items: flex-start;
    background: #0a1220;
}

#casesPage.active {
    display: flex;
    animation: pageSlideIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

@keyframes pageSlideIn {
    0%   { opacity: 0; transform: scale(0.88) translateY(50px); }
    100% { opacity: 1; transform: scale(1) translateY(0); }
}

.cases-container {
    position: relative;
    z-index: 2;
    max-width: 500px;
    width: 100%;
    padding: 40px 30px;
    margin: 0 auto;
}

.cases-title {
    font-size: 2.8rem;
    font-weight: 700;
    text-align: center;
    letter-spacing: -0.6px;
    background: linear-gradient(180deg, #00B4FF, #0088FF, #0A246A, #0088FF, #00B4FF);
    background-size: 100% 300%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    font-family: 'Tahoma', sans-serif;
    animation: titleGradientShift 5s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(0, 140, 255, 0.8));
    margin-bottom: 40px;
}

/* ─── STEAM SIGN-UP WINDOW ─── */
.steam-window {
    background: #ECE9D8;
    border: 3px solid #0054E3;
    border-radius: 10px;
    overflow: hidden;
    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.6),
        0 0 80px rgba(0, 140, 255, 0.5);
    animation: windowGlow 5s ease-in-out infinite alternate;
}

.steam-titlebar {
    height: 34px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    background: linear-gradient(180deg, #1B2838 0%, #2A475E 50%, #1B2838 100%);
    border-bottom: 2px solid #0F1B26;
    font-size: 0.85rem;
    font-weight: 700;
    color: #C7D5E0;
    letter-spacing: 0.5px;
    text-shadow: 0 1px 1px rgba(0, 0, 0, 0.6);
}

.steam-logo {
    width: 22px;
    height: 22px;
    margin-right: 10px;
    fill: #C7D5E0;
}

.steam-body {
    padding: 34px 34px 30px;
    text-align: center;
}

.steam-heading {
    font-size: 1.4rem;
    font-weight: 700;
    color: #0A246A;
    margin-bottom: 8px;
    font-family: 'Tahoma', sans-serif;
}

.steam-sub {
    font-size: 0.82rem;
    color: #666;
    margin-bottom: 26px;
    font-family: 'Tahoma', sans-serif;
    line-height: 1.4;
}

.steam-field {
    text-align: left;
    margin-bottom: 16px;
}

.steam-label {
    display: block;
    font-size: 0.78rem;
    font-weight: 700;
    color: #000;
    margin-bottom: 6px;
    font-family: 'Tahoma', sans-serif;
}

.steam-input {
    width: 100%;
    padding: 11px 13px;
    font-size: 0.9rem;
    font-family: 'Tahoma', sans-serif;
    color: #000;
    background: #FFFFFF;
    border: 2px inset #ECE9D8;
    border-radius: 3px;
    box-shadow: inset 1px 1px 2px rgba(0, 0, 0, 0.15);
    outline: none;
    transition: all 0.15s ease;
    cursor: text;
}

.steam-input:focus {
    border-color: #0088FF;
    box-shadow: inset 1px 1px 2px rgba(0, 0, 0, 0.15), 0 0 8px rgba(0, 140, 255, 0.5);
}

.steam-submit {
    width: 100%;
    margin-top: 10px;
    padding: 14px 20px;
    font-size: 1rem;
    font-weight: 700;
    color: #FFF;
    background: linear-gradient(180deg, #66C0F4 0%, #1B6D9F 45%, #0F4A6E 100%);
    border: 2px outset #ECE9D8;
    border-radius: 6px;
    font-family: 'Tahoma', sans-serif;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5), 0 6px 18px rgba(0, 84, 227, 0.5);
    letter-spacing: 0.7px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.5);
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    cursor: none;
    -webkit-tap-highlight-color: transparent;
}

.steam-submit:hover {
    background: linear-gradient(180deg, #8FD4FF 0%, #2A89C7 45%, #156286 100%);
    transform: translateY(-3px) scale(1.03);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7), 0 12px 28px rgba(0, 140, 255, 0.7), 0 0 60px rgba(100, 200, 255, 0.5);
}

.steam-submit:active {
    border: 2px inset #ECE9D8;
    transform: translateY(-1px) scale(0.97);
}

.steam-footnote {
    margin-top: 18px;
    font-size: 0.7rem;
    color: #888;
    font-family: 'Tahoma', sans-serif;
    line-height: 1.4;
}

/* ─── BACK BUTTON ─── */
.back-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 32px;
    font-size: 0.92rem;
    font-weight: 700;
    border-radius: 6px;
    margin: 30px auto 0;
    width: 100%;
    max-width: 330px;
    color: #000;
    background: linear-gradient(180deg, #FFFFFF, #E8E4D8 45%, #D4D0C8);
    border: 2px outset #ECE9D8;
    font-family: 'Tahoma', sans-serif;
    box-shadow:
        1px 1px 0 #FFFFFF inset,
        -1px -1px 0 #808080 inset,
        0 6px 14px rgba(0, 0, 0, 0.25);
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

.back-btn:hover {
    background: linear-gradient(180deg, #FFFFFF, #F4F0E2 45%, #E4E0D0);
    transform: translateY(-4px) scale(1.05);
    border-color: #0088FF;
    box-shadow:
        1px 1px 0 #FFFFFF inset,
        -1px -1px 0 #808080 inset,
        0 12px 28px rgba(0, 140, 255, 0.55),
        0 0 50px rgba(0, 180, 255, 0.4);
}

.back-btn svg { width: 16px; height: 16px; fill: #000; }

.back-row {
    display: flex;
    justify-content: center;
    width: 100%;
}

/* ─── MOBILE ─── */
@media (max-width: 480px) {
    body { padding: 10px; }
    .main-content { padding: 35px 18px; }
    #typewriter { font-size: 1.8rem; }
    .btn-merch, .btn-discord { height: 50px; font-size: 0.85rem; width: 220px; }
    .cases-title { font-size: 2rem; }
    .steam-body { padding: 26px 20px 24px; }
    .steam-heading { font-size: 1.2rem; }
}


/* UI grid repair */
.button-grid, .buttons-grid, .button-container, .buttons, .links, .link-grid {
    display: grid !important;
    grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
    gap: 14px !important;
    width: 100%;
}
.button-grid > *, .buttons-grid > *, .button-container > *, .buttons > *, .links > *, .link-grid > * {
    width: 100% !important;
    min-width: 0;
}
@media (max-width: 520px) {
    .button-grid, .buttons-grid, .button-container, .buttons, .links, .link-grid {
        grid-template-columns: 1fr !important;
    }
}

</style>
</head>

<script>
try {
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
} catch (e) {}

function $(id) { return document.getElementById(id); }

function playClickSound(freq) {
    freq = freq || 800;
    try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.12);
    } catch (e) {}
}

/* ─── TYPEWRITER — now says "Cleetus Drop" ─── */
(function typewriter() {
    var target = $('typed-text');
    if (!target) return;
    var word = 'Cleetus Drop';
    var idx = 0;
    var deleting = false;
    var speed = 150;

    function step() {
        if (!deleting) {
            target.textContent = word.substring(0, idx + 1);
            idx++;
            if (idx === word.length) {
                deleting = true;
                speed = 2200;
                setTimeout(function () { speed = 70; }, 2200);
            }
        } else {
            target.textContent = word.substring(0, idx - 1);
            idx--;
            if (idx === 0) {
                deleting = false;
                speed = 130;
            }
        }
        setTimeout(step, speed);
    }
    step();
})();

/* ─── PAGE NAV ─── */
function showCases() {
    playClickSound(800);
    var main = $('mainPage');
    var cases = $('casesPage');
    if (!main || !cases) return;
    main.style.display = 'none';
    cases.style.display = 'flex';
    cases.classList.add('active');
    try { window.Telegram.WebApp.expand(); } catch (e) {}
}

function hideCases() {
    playClickSound(600);
    var main = $('mainPage');
    var cases = $('casesPage');
    if (!main || !cases) return;
    cases.style.display = 'none';
    cases.classList.remove('active');
    main.style.display = 'block';
    try { window.Telegram.WebApp.expand(); } catch (e) {}
}

/* ─── EVENT BINDINGS ─── */
document.addEventListener('DOMContentLoaded', bindAll);
(function () { setTimeout(bindAll, 0); })();

function bindAll() {
    var casesBtn = $('casesBtn');
    var backBtn = $('backBtn');
    var steamSubmit = $('steamSubmit');

    if (casesBtn && !casesBtn.dataset.bound) {
        casesBtn.addEventListener('click', showCases);
        casesBtn.dataset.bound = '1';
    }
    if (backBtn && !backBtn.dataset.bound) {
        backBtn.addEventListener('click', hideCases);
        backBtn.dataset.bound = '1';
    }
    if (steamSubmit && !steamSubmit.dataset.bound) {
        steamSubmit.addEventListener('click', function () {
            playClickSound(900);
        });
        steamSubmit.dataset.bound = '1';
    }
}

/* ─── CURSOR ─── */
(function () {
    var cursor = $('customCursor');
    if (!cursor) return;

    var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    if (isTouch) {
        cursor.style.display = 'none';
        return;
    }

    document.addEventListener('mousemove', function (e) {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
        cursor.style.opacity = '1';
    });

    document.addEventListener('mouseleave', function () {
        cursor.style.opacity = '0';
    });

    var sel = 'button, a, .case-image, .back-btn, .steam-submit, .btn-merch, .btn-discord, .steam-input';
    document.addEventListener('mouseover', function (e) {
        if (e.target.closest(sel)) cursor.classList.add('hover');
    });
    document.addEventListener('mouseout', function (e) {
        if (e.target.closest(sel)) cursor.classList.remove('hover');
    });

    document.addEventListener('mousedown', function () { cursor.classList.add('click'); });
    document.addEventListener('mouseup', function () { cursor.classList.remove('click'); });
})();

/* ─── INTERACTIVE BACKGROUND ─── */
document.addEventListener('mousemove', function (e) {
    var x = (e.clientX / window.innerWidth) * 100;
    var y = (e.clientY / window.innerHeight) * 100;
    document.documentElement.style.setProperty('--mx', x + '%');
    document.documentElement.style.setProperty('--my', y + '%');
});

/* ─── KEYBOARD ─── */
document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('casesPage').classList.contains('active')) {
        hideCases();
    }
});
</script>


<script>
(() => {
  const repairButtonGrids = () => {
    document.querySelectorAll('button, a').forEach((el) => {
      const parent = el.parentElement;
      if (!parent) return;
      const actions = [...parent.children].filter((child) =>
        child.matches('button, a') && child.offsetParent !== null
      );
      if (actions.length >= 2) {
        parent.style.display = 'grid';
        parent.style.gridTemplateColumns = 'repeat(2, minmax(0, 1fr))';
        parent.style.gap = '14px';
        actions.forEach((child) => child.style.width = '100%');
      }
    });
  };
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', repairButtonGrids);
  } else {
    repairButtonGrids();
  }
})();
</script>
