<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Cleetus</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{margin:0;padding:0;box-sizing:border-box;cursor:none !important;}

body{
    font-family:'Tahoma','Segoe UI',sans-serif;
    min-height:100vh;
    display:flex;justify-content:center;align-items:center;
    padding:16px;overflow:hidden;position:relative;
    background:#0a1220;
    -webkit-tap-highlight-color:transparent;
}

body::before{
    content:'';position:fixed;inset:-20%;z-index:0;
    background:
        radial-gradient(circle at var(--mouse-x,30%) var(--mouse-y,50%),rgba(0,140,255,0.35) 0%,transparent 40%),
        radial-gradient(circle at calc(100% - var(--mouse-x,30%)) calc(100% - var(--mouse-y,50%)),rgba(80,200,255,0.25) 0%,transparent 45%),
        radial-gradient(circle at 50% 50%,rgba(10,30,80,0.9) 0%,#050812 80%);
    animation:bgBreath 10s ease-in-out infinite alternate;
    transition:background 0.4s ease-out;
    pointer-events:none;
}

@keyframes bgBreath{
    0%{transform:scale(1);}
    100%{transform:scale(1.06);}
}

body::after{
    content:'';position:fixed;inset:0;z-index:0;
    background:linear-gradient(115deg,transparent 20%,rgba(0,140,255,0.06) 35%,rgba(120,220,255,0.12) 45%,rgba(0,140,255,0.06) 55%,transparent 70%);
    background-size:300% 300%;
    animation:auroraSweep 12s linear infinite;
    pointer-events:none;mix-blend-mode:screen;
}

@keyframes auroraSweep{
    0%{background-position:0% 0%;}
    100%{background-position:200% 100%;}
}

.custom-cursor{
    position:fixed;pointer-events:none;z-index:99999;
    width:32px;height:32px;transform:translate(-50%,-50%);
    transition:width .15s ease,height .15s ease,opacity .3s ease,filter .3s ease;
    will-change:transform,left,top;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='b' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='%23FFFFFF'/><stop offset='100%' stop-color='%23E0E0E0'/></linearGradient></defs><path d='M4 2 L4 24 L10 18 L14 28 L18 26 L14 16 L22 16 Z' fill='url(%23b)' stroke='%23000' stroke-width='1.2' stroke-linejoin='round'/></svg>") no-repeat center center;
    background-size:contain;
}

.custom-cursor.click{width:22px !important;height:22px !important;}
.custom-cursor.hover{width:42px;height:42px;opacity:1;filter:drop-shadow(0 0 14px rgba(120,200,255,1)) drop-shadow(0 0 30px rgba(80,180,255,0.6));}
.custom-cursor.hidden{opacity:0;}

#mainPage{
    position:relative;z-index:2;border-radius:10px;
    padding:0;max-width:480px;width:100%;text-align:center;
    background:#ECE9D8;
    border:3px solid #0054E3;
    box-shadow:0 20px 60px rgba(0,0,0,0.6),0 0 80px rgba(0,140,255,0.5),0 0 140px rgba(0,140,255,0.25),inset 0 0 0 1px rgba(255,255,255,0.5);
    overflow:hidden;
    animation:windowGlow 5s ease-in-out infinite alternate;
}

@keyframes windowGlow{
    0%{box-shadow:0 20px 60px rgba(0,0,0,0.6),0 0 60px rgba(0,140,255,0.4),0 0 100px rgba(0,140,255,0.2),inset 0 0 0 1px rgba(255,255,255,0.5);}
    100%{box-shadow:0 25px 70px rgba(0,0,0,0.7),0 0 120px rgba(0,140,255,0.7),0 0 200px rgba(0,140,255,0.4),inset 0 0 0 1px rgba(255,255,255,0.5);}
}

.main-content{padding:50px 40px 45px;}
#mainPage.hidden{display:none;}
#mainPage.slide-out{animation:mainSlideOut .5s cubic-bezier(.4,0,.2,1) forwards;}
#mainPage.slide-in{animation:mainSlideIn .7s cubic-bezier(.34,1.56,.64,1) forwards;}

@keyframes mainSlideOut{
    0%{opacity:1;transform:scale(1) translateY(0);}
    100%{opacity:0;transform:scale(.92) translateY(-30px);}
}
@keyframes mainSlideIn{
    0%{opacity:0;transform:scale(.92) translateY(30px);}
    100%{opacity:1;transform:scale(1) translateY(0);}
}

.title-wrapper{min-height:80px;display:flex;justify-content:center;align-items:center;margin-bottom:30px;position:relative;}

#typewriter{
    font-size:2.5rem;font-weight:700;letter-spacing:-.5px;line-height:1.1;
    background:linear-gradient(180deg,#0A246A,#0088FF,#0A246A);
    background-size:100% 200%;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    font-family:'Tahoma',sans-serif;
    animation:titleGradientShift 4s ease-in-out infinite;
    filter:drop-shadow(0 0 12px rgba(0,140,255,.6));
}

@keyframes titleGradientShift{
    0%,100%{background-position:0% 0%;}
    50%{background-position:0% 100%;}
}

#typewriter .cursor{
    display:inline-block;width:3px;height:.8em;margin-left:4px;
    background:#0088FF;
    box-shadow:0 0 14px rgba(0,140,255,1);
    animation:blink .8s step-end infinite;
    -webkit-text-fill-color:initial;
}

@keyframes blink{0%,100%{opacity:1;}50%{opacity:0;}}

.btn-wrapper{position:relative;display:flex;justify-content:center;width:100%;margin-bottom:12px;}
.buttons-container{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;}

.btn-merch,.btn-discord{
    position:relative;display:inline-flex;align-items:center;justify-content:center;
    gap:10px;height:54px;padding:0 26px;
    font-size:.92rem;font-weight:700;color:#000;
    border:2px outset #ECE9D8;border-radius:6px;
    text-decoration:none;letter-spacing:.6px;
    overflow:hidden;width:260px;max-width:100%;
    font-family:'Tahoma',sans-serif;
    background:linear-gradient(180deg,#FFFFFF,#E8E4D8 45%,#D4D0C8);
    box-shadow:1px 1px 0 #FFFFFF inset,-1px -1px 0 #808080 inset,0 4px 12px rgba(0,0,0,.25);
    transition:all .35s cubic-bezier(.34,1.56,.64,1);
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
}

.btn-merch::before,.btn-discord::before{
    content:'';position:absolute;top:0;left:-120%;width:100%;height:100%;
    background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.9) 50%,transparent 100%);
    transition:left .9s cubic-bezier(.4,0,.2,1);z-index:1;
}

.btn-merch::after,.btn-discord::after{
    content:'';position:absolute;inset:-4px;border-radius:8px;
    background:radial-gradient(ellipse at center,rgba(0,180,255,.9),rgba(0,80,220,.4) 50%,transparent 80%);
    opacity:0;transition:opacity .4s ease;z-index:-1;filter:blur(12px);
}

.btn-merch:hover::before,.btn-discord:hover::before{left:120%;}
.btn-merch:hover::after,.btn-discord:hover::after{opacity:1;}

.btn-merch:hover,.btn-discord:hover{
    background:linear-gradient(180deg,#FFFFFF,#F4F0E2 45%,#E4E0D0);
    transform:translateY(-5px) scale(1.06);border-color:#00A8FF;
    box-shadow:1px 1px 0 #FFFFFF inset,-1px -1px 0 #808080 inset,0 14px 32px rgba(0,140,255,.55),0 0 60px rgba(0,180,255,.5);
}

.btn-merch:active,.btn-discord:active{
    border:2px inset #ECE9D8;transform:translateY(-1px) scale(.96);
    box-shadow:-1px -1px 0 #FFFFFF inset,1px 1px 0 #808080 inset,0 2px 6px rgba(0,0,0,.4);
}

.btn-merch .btn-text,.btn-discord .btn-text{position:relative;z-index:2;}
.discord-icon{width:22px;height:22px;fill:#5865F2;transition:transform .4s cubic-bezier(.34,1.56,.64,1);flex-shrink:0;position:relative;z-index:2;}
.btn-discord:hover .discord-icon{transform:scale(1.3) rotate(-12deg);filter:drop-shadow(0 0 8px rgba(88,101,242,1));}

/* ─── CASES PAGE ─── */
#casesPage{
    display:none;position:fixed;top:0;left:0;
    width:100%;height:100%;z-index:100;
    overflow-y:auto;padding:40px 20px;
    justify-content:center;align-items:flex-start;
    background:#0a1220;
}

#casesPage::before{
    content:'';position:absolute;inset:0;
    background:
        radial-gradient(circle at 25% 30%,rgba(0,140,255,0.2) 0%,transparent 45%),
        radial-gradient(circle at 75% 70%,rgba(80,200,255,0.15) 0%,transparent 45%);
    pointer-events:none;animation:plansGlow 8s ease-in-out infinite alternate;
}

@keyframes plansGlow{
    0%{opacity:0.8;transform:scale(1);}
    100%{opacity:1;transform:scale(1.05);}
}

#casesPage.active{display:flex;animation:pageSlideIn .8s cubic-bezier(.34,1.56,.64,1) forwards;}
#casesPage.exit{animation:pageSlideOut .5s cubic-bezier(.4,0,.2,1) forwards;}

@keyframes pageSlideIn{
    0%{opacity:0;transform:scale(.88) translateY(50px);}
    100%{opacity:1;transform:scale(1) translateY(0);}
}
@keyframes pageSlideOut{
    0%{opacity:1;transform:scale(1) translateY(0);}
    100%{opacity:0;transform:scale(.94) translateY(30px);}
}

.cases-container{position:relative;z-index:2;max-width:900px;width:100%;padding:40px 30px;}

.cases-title{
    font-size:2.8rem;font-weight:700;text-align:center;
    letter-spacing:-.6px;
    background:linear-gradient(180deg,#00B4FF,#0088FF,#0A246A,#0088FF,#00B4FF);
    background-size:100% 300%;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    font-family:'Tahoma',sans-serif;
    animation:plansTitleGradient 5s ease-in-out infinite;
    filter:drop-shadow(0 0 20px rgba(0,140,255,.8));
    margin-bottom:50px;
}

@keyframes plansTitleGradient{
    0%,100%{background-position:0% 0%;}
    50%{background-position:0% 100%;}
}

.case-wrapper{
    position:relative;
    display:flex;flex-direction:column;align-items:center;
    gap:30px;
}

.case-image{
    width:260px;height:auto;
    cursor:none !important;
    transition:all .4s cubic-bezier(.34,1.56,.64,1);
    filter:drop-shadow(0 0 30px rgba(0,140,255,.6)) drop-shadow(0 10px 20px rgba(0,0,0,.5));
    animation:caseFloat 3s ease-in-out infinite alternate;
}

@keyframes caseFloat{
    0%{transform:translateY(0) rotate(-2deg);}
    100%{transform:translateY(-12px) rotate(2deg);}
}

.case-image:hover{
    transform:scale(1.08) rotate(0deg);
    filter:drop-shadow(0 0 50px rgba(0,180,255,1)) drop-shadow(0 15px 30px rgba(0,0,0,.6));
}

.case-image:active{
    transform:scale(0.95);
}

/* ─── UNBOXING ANIMATION ─── */
#unboxOverlay{
    display:none;position:fixed;top:0;left:0;
    width:100%;height:100%;z-index:500;
    background:rgba(0,0,0,0.85);
    justify-content:center;align-items:center;
    flex-direction:column;padding:20px;
}

#unboxOverlay.active{display:flex;}

.unbox-spinner{
    width:80px;height:80px;
    border:5px solid rgba(0,140,255,0.2);
    border-top-color:#00B4FF;
    border-radius:50%;
    animation:spin 0.8s linear infinite;
    margin-bottom:24px;
}

@keyframes spin{
    0%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
}

.unbox-text{
    color:#FFFFFF;font-family:'Tahoma',sans-serif;
    font-size:1.1rem;font-weight:700;
    letter-spacing:1px;
    animation:pulseText 1.2s ease-in-out infinite;
}

@keyframes pulseText{
    0%,100%{opacity:0.6;}
    50%{opacity:1;}
}

/* ─── SKIN REVEAL ─── */
#skinReveal{
    display:none;position:fixed;top:0;left:0;
    width:100%;height:100%;z-index:600;
    background:rgba(0,0,0,0.9);
    justify-content:center;align-items:center;
    flex-direction:column;padding:30px;
}

#skinReveal.active{display:flex;animation:fadeIn .5s ease forwards;}

@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}

.skin-card{
    background:linear-gradient(160deg,#F4F1E8 0%,#ECE9D8 55%,#E4E0D0 100%);
    border:3px solid #0054E3;border-radius:16px;
    padding:30px;max-width:420px;width:100%;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.7),0 0 80px rgba(0,140,255,0.6);
    animation:skinPop .6s cubic-bezier(.34,1.56,.64,1) forwards;
}

@keyframes skinPop{
    0%{opacity:0;transform:scale(0.5) rotate(-8deg);}
    100%{opacity:1;transform:scale(1) rotate(0deg);}
}

.skin-rarity{
    display:inline-block;
    padding:4px 16px;border-radius:20px;
    font-size:.7rem;font-weight:700;
    letter-spacing:1px;text-transform:uppercase;
    margin-bottom:16px;
    font-family:'Tahoma',sans-serif;
}

.skin-image{
    width:100%;max-width:280px;height:auto;
    margin:0 auto 20px;
    display:block;
    filter:drop-shadow(0 10px 20px rgba(0,0,0,0.4));
    animation:skinGlow 2s ease-in-out infinite alternate;
}

@keyframes skinGlow{
    0%{filter:drop-shadow(0 10px 20px rgba(0,0,0,0.4));}
    100%{filter:drop-shadow(0 10px 20px rgba(0,0,0,0.4)) drop-shadow(0 0 30px rgba(0,180,255,0.8));}
}

.skin-name{
    font-size:1.3rem;font-weight:700;
    color:#0A246A;
    font-family:'Tahoma',sans-serif;
    margin-bottom:6px;
    text-shadow:0 1px 0 rgba(255,255,255,0.6);
}

.skin-weapon{
    font-size:.85rem;color:#666;
    font-family:'Tahoma',sans-serif;
    margin-bottom:20px;
}

.skin-continue{
    padding:14px 40px;
    font-size:.95rem;font-weight:700;color:#FFF;
    background:linear-gradient(180deg,#5FB4FF 0%,#1470D9 45%,#0A4FB0 100%);
    border:2px outset #ECE9D8;border-radius:6px;
    font-family:'Tahoma',sans-serif;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 6px 18px rgba(0,84,227,.6);
    text-shadow:0 1px 3px rgba(0,0,0,.6);
    letter-spacing:.7px;
    transition:all .35s cubic-bezier(.34,1.56,.64,1);
    cursor:none !important;
    -webkit-tap-highlight-color:transparent;
}

.skin-continue:hover{
    background:linear-gradient(180deg,#88C8FF 0%,#2988F0 45%,#1668CC 100%);
    transform:translateY(-3px) scale(1.05);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.9),0 12px 28px rgba(0,140,255,.85),0 0 60px rgba(100,200,255,.6);
}

.skin-continue:active{
    border:2px inset #ECE9D8;
    transform:translateY(-1px) scale(.96);
}

.back-btn{
    display:inline-flex;align-items:center;justify-content:center;
    gap:10px;padding:14px 32px;font-size:.92rem;font-weight:700;
    border-radius:6px;margin:0 auto;width:100%;max-width:330px;
    color:#000;
    background:linear-gradient(180deg,#FFFFFF,#E8E4D8 45%,#D4D0C8);
    border:2px outset #ECE9D8;
    font-family:'Tahoma',sans-serif;
    box-shadow:1px 1px 0 #FFFFFF inset,-1px -1px 0 #808080 inset,0 6px 14px rgba(0,0,0,.25);
    position:relative;overflow:hidden;
    transition:all .35s cubic-bezier(.34,1.56,.64,1);
    -webkit-tap-highlight-color:transparent;touch-action:manipulation;
    margin-top:40px;
}

.back-btn::before{
    content:'';position:absolute;top:0;left:-120%;width:100%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);
    transition:left .8s cubic-bezier(.4,0,.2,1);
}

.back-btn:hover::before{left:120%;}

.back-btn:hover{
    background:linear-gradient(180deg,#FFFFFF,#F4F0E2 45%,#E4E0D0);
    transform:translateY(-4px) scale(1.05);
    border-color:#0088FF;
    box-shadow:1px 1px 0 #FFFFFF inset,-1px -1px 0 #808080 inset,0 12px 28px rgba(0,140,255,.55),0 0 50px rgba(0,180,255,.4);
}

.back-btn:active{
    border:2px inset #ECE9D8;
    transform:translateY(-1px) scale(.97);
}

.back-btn svg{width:16px;height:16px;fill:#000;transition:transform .35s cubic-bezier(.34,1.56,.64,1);}
.back-btn:hover svg{transform:translateX(-6px) scale(1.1);}
.back-row{display:flex;flex-direction:column;align-items:center;gap:12px;margin-top:10px;}

@media (max-width: 480px){
    body{padding:10px;}
    .main-content{padding:35px 18px 35px;}
    #typewriter{font-size:1.8rem;}
    .btn-merch,.btn-discord{height:50px;font-size:.85rem;width:220px;}
    .cases-title{font-size:2rem;}
    .case-image{width:200px;}
    .skin-card{padding:24px 18px;}
    .skin-name{font-size:1.1rem;}
    .custom-cursor{display:none !important;}
}

@media (hover: none) and (pointer: coarse){
    .custom-cursor{display:none !important;}
    *{cursor:auto !important;}
    .btn-merch:hover,.btn-discord:hover,.case-image:hover,.back-btn:hover,.skin-continue:hover{transform:none;}
}
</style>
</head>
<body>

<div class="custom-cursor" id="customCursor"></div>

<div id="mainPage">
    <div class="main-content">
        <div class="title-wrapper">
            <h1 id="typewriter">
                <span id="typed-text"></span><span class="cursor"></span>
            </h1>
        </div>

        <div class="buttons-container">
            <div class="btn-wrapper">
                <button type="button" class="btn-merch" id="casesBtn">
                    <span class="btn-text">Cases</span>
                </button>
            </div>

            <div class="btn-wrapper">
                <a href="https://discord.gg/8qCDcjFH7c" class="btn-discord" target="_blank" rel="noopener" id="discordBtn">
                    <svg class="discord-icon" viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg">
                        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S53.9,46,53.9,53,48.77,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.21,60,73.21,53s5-12.74,11.44-12.74S96.12,46,96.12,53,91,65.69,84.69,65.69Z"/>
                    </svg>
                    <span class="btn-text">Discord</span>
                </a>
            </div>
        </div>
    </div>
</div>

<div id="casesPage">
    <div class="cases-container">
        <h1 class="cases-title">Cases</h1>

        <div class="case-wrapper">
            <img
                src="https://raw.githubusercontent.com/Flo4604/CS2-CDN/main/assets/cases/gallery_case.png"
                alt="CS2 Gallery Case"
                class="case-image"
                id="caseImage"
            />
        </div>

        <div class="back-row">
            <button type="button" class="back-btn" id="backBtn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
                </svg>
                <span>Back to Home</span>
            </button>
        </div>
    </div>
</div>

<div id="unboxOverlay">
    <div class="unbox-spinner"></div>
    <div class="unbox-text">UNLOCKING CONTAINER...</div>
</div>

<div id="skinReveal">
    <div class="skin-card">
        <div class="skin-rarity" id="skinRarity">Covert</div>
        <img src="" alt="Skin" class="skin-image" id="skinImage" />
        <div class="skin-name" id="skinName">AK-47 | Redline</div>
        <div class="skin-weapon" id="skinWeapon">AK-47</div>
        <button type="button" class="skin-continue" id="skinContinue">Continue</button>
    </div>
</div>

<script>
const tg = window.Telegram.WebApp;
tg.ready();
tg.expand();

function el(id){ return document.getElementById(id); }

function playClickSound(freq = 800){
    try{
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
        osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.12);
    }catch(e){}
}

/* ─── SKIN POOL (using CS2 CDN images) ─── */
const SKINS = [
    {
        name: 'AK-47 | The Oligarch',
        weapon: 'AK-47',
        rarity: 'Covert',
        color: '#EB4B4B',
        image: 'https://raw.githubusercontent.com/Flo4604/CS2-CDN/main/assets/weapons/ak47_the_oligarch.png'
    },
    {
        name: 'M4A4 | Full Throttle',
        weapon: 'M4A4',
        rarity: 'Covert',
        color: '#EB4B4B',
        image: 'https://raw.githubusercontent.com/Flo4604/CS2-CDN/main/assets/weapons/m4a4_full_throttle.png'

/* ─── PAGE NAV ─── */
function showCases(){
    playClickSound(800);
    const main = el('mainPage');
    const cases = el('casesPage');
    main.classList.remove('slide-in');
    main.classList.add('slide-out');
    setTimeout(() => {
        main.classList.add('hidden');
        main.classList.remove('slide-out');
        cases.style.display = 'flex';
        cases.classList.remove('exit');
        cases.classList.add('active');
        tg.expand();
    }, 500);
}

function hideCases(){
    playClickSound(600);
    const main = el('mainPage');
    const cases = el('casesPage');
    cases.classList.remove('active');
    cases.classList.add('exit');
    setTimeout(() => {
        cases.classList.remove('exit');
        cases.style.display = 'none';
        main.classList.remove('hidden');
        main.classList.add('slide-in');
        setTimeout(() => main.classList.remove('slide-in'), 700);
        tg.expand();
    }, 500);
}

/* ─── UNBOXING ─── */
function openCase(){
    playClickSound(1000);
    el('unboxOverlay').classList.add('active');

    setTimeout(() => {
        el('unboxOverlay').classList.remove('active');

        // Pick random skin
        const skin = SKINS[Math.floor(Math.random() * SKINS.length)];

        el('skinRarity').textContent = skin.rarity;
        el('skinRarity').style.background = skin.color;
        el('skinRarity').style.color = '#FFF';
        el('skinName').textContent = skin.name;
        el('skinWeapon').textContent = skin.weapon;
        el('skinImage').src = skin.image;
        el('skinImage').alt = skin.name;

        el('skinReveal').classList.add('active');
    }, 2500);
}

function closeReveal(){
    playClickSound(600);
    el('skinReveal').classList.remove('active');
}

/* ─── EVENT BINDINGS ─── */
el('casesBtn').addEventListener('click', showCases);
el('backBtn').addEventListener('click', hideCases);
el('caseImage').addEventListener('click', openCase);
el('skinContinue').addEventListener('click', closeReveal);

/* ─── TYPEWRITER ─── */
(function(){
    const target = el('typed-text');
    const word = 'Cleetus';
    let idx = 0, deleting = false, speed = 200;

    function step(){
        if (!deleting){
            target.textContent = word.substring(0, idx + 1);
            idx++;
            if (idx === word.length){
                deleting = true;
                speed = 2200;
                setTimeout(() => speed = 90, 2200);
            }
        } else {
            target.textContent = word.substring(0, idx - 1);
            idx--;
            if (idx === 0){
                deleting = false;
                speed = 150;
            }
        }
        setTimeout(step, speed);
    }
    setTimeout(step, 400);
})();

/* ─── CURSOR ─── */
const cursor = el('customCursor');
document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top = e.clientY + 'px';
    cursor.classList.remove('hidden');
});
document.addEventListener('mouseleave', () => cursor.classList.add('hidden'));

document.addEventListener('mouseover', e => {
    if (e.target.closest('button, a, .case-image, .back-btn, .skin-continue')){
        cursor.classList.add('hover');
    }
});
document.addEventListener('mouseout', e => {
    if (e.target.closest('button, a, .case-image, .back-btn, .skin-continue')){
        cursor.classList.remove('hover');
    }
});
document.addEventListener('mousedown', () => cursor.classList.add('click'));
document.addEventListener('mouseup', () => cursor.classList.remove('click'));

/* ─── INTERACTIVE GRADIENT ─── */
document.addEventListener('mousemove', e => {
    const x = (e.clientX / window.innerWidth) * 100;
    const y = (e.clientY / window.innerHeight) * 100;
    document.documentElement.style.setProperty('--mouse-x', x + '%');
    document.documentElement.style.setProperty('--mouse-y', y + '%');
});

/* ─── KEYBOARD ─── */
document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){
        if (el('skinReveal').classList.contains('active')) closeReveal();
        else if (el('casesPage').classList.contains('active')) hideCases();
    }
});

console.log('Cleetus loaded — Cases active.');
