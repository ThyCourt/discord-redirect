<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Cleetus Drop</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    min-height: 100vh;
    font-family: 'Tahoma', 'Segoe UI', sans-serif;
    background: #0a1220;
    overflow: hidden;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 16px;
    position: relative;
    cursor: none;
    -webkit-tap-highlight-color: transparent;
}

a, button, input {
    cursor: none;
}

@media (hover: none), (pointer: coarse) {
    body, a, button, input { cursor: auto; }
    .custom-cursor { display: none !important; }
}

/* ─── BACKGROUND ─── */
body::before {
    content: '';
    position: fixed;
    inset: -20%;
    z-index: 0;
    background:
        radial-gradient(circle at var(--mx, 30%) var(--my, 50%), rgba(0, 140, 255, 0.35) 0%, transparent 40%),
        radial-gradient(circle at calc(100% - var(--mx, 30%)) calc(100% - var(--my, 50%)), rgba(80, 200, 255, 0.25) 0%, transparent 45%),
        radial-gradient(circle at 50% 50%, rgba(10, 30, 80, 0.9) 0%, #050812 80%);
    animation: bgBreath 10s ease-in-out infinite alternate;
    pointer-events: none;
}

@keyframes bgBreath {
    0%   { transform: scale(1); }
    100% { transform: scale(1.06); }
}

body::after {
    content: '';
    position: fixed;
    inset: 0;
    z-index: 0;
    background: linear-gradient(115deg,
        transparent 20%,
        rgba(0, 140, 255, 0.06) 35%,
        rgba(120, 220, 255, 0.12) 45%,
        rgba(0, 140, 255, 0.06) 55%,
        transparent 70%);
    background-size: 300% 300%;
    animation: auroraSweep 12s linear infinite;
    pointer-events: none;
    mix-blend-mode: screen;
}

@keyframes auroraSweep {
    0%   { background-position: 0% 0%; }
    100% { background-position: 200% 100%; }
}

/* ─── CURSOR ─── */
.custom-cursor {
    position: fixed;
    top: 0;
    left: 0;
    width: 32px;
    height: 32px;
    margin-left: -16px;
    margin-top: -16px;
    pointer-events: none;
    z-index: 999999;
    background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='b' x1='0' y1='0' x2='1' y2='1'><stop offset='0%' stop-color='%23FFFFFF'/><stop offset='100%' stop-color='%23E0E0E0'/></linearGradient></defs><path d='M4 2 L4 24 L10 18 L14 28 L18 26 L14 16 L22 16 Z' fill='url(%23b)' stroke='%23000' stroke-width='1.2' stroke-linejoin='round'/></svg>") no-repeat center;
    background-size: contain;
    transition: width 0.15s ease, height 0.15s ease, margin 0.15s ease, filter 0.3s ease;
}

.custom-cursor.hover {
    width: 42px;
    height: 42px;
    margin-left: -21px;
    margin-top: -21px;
    filter: drop-shadow(0 0 14px rgba(120, 200, 255, 1));
}

.custom-cursor.click {
    width: 22px;
    height: 22px;
    margin-left: -11px;
    margin-top: -11px;
}

/* ─── MAIN WINDOW ─── */
#mainPage {
    position: relative;
    z-index: 2;
    border-radius: 10px;
    max-width: 480px;
    width: 100%;
    text-align: center;
    background: #ECE9D8;
    border: 3px solid #0054E3;
    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.6),
        0 0 80px rgba(0, 140, 255, 0.5),
        0 0 140px rgba(0, 140, 255, 0.25),
        inset 0 0 0 1px rgba(255, 255, 255, 0.5);
    overflow: hidden;
    animation: windowGlow 5s ease-in-out infinite alternate;
}

@keyframes windowGlow {
    0% {
        box-shadow:
            0 20px 60px rgba(0, 0, 0, 0.6),
            0 0 60px rgba(0, 140, 255, 0.4),
            0 0 100px rgba(0, 140, 255, 0.2),
            inset 0 0 0 1px rgba(255, 255, 255, 0.5);
    }
    100% {
        box-shadow:
            0 25px 70px rgba(0, 0, 0, 0.7),
            0 0 120px rgba(0, 140, 255, 0.7),
            0 0 200px rgba(0, 140, 255, 0.4),
            inset 0 0 0 1px rgba(255, 255, 255, 0.5);
    }
}

.main-content {
    padding: 50px 40px 45px;
}

/* ─── TYPEWRITER ─── */
.title-wrapper {
    min-height: 80px;
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 30px;
}

#typewriter {
    font-size: 2.5rem;
    font-weight: 700;
    letter-spacing: -0.5px;
    line-height: 1.1;
    font-family: 'Tahoma', sans-serif;
    color: #0A246A;
    min-height: 1.1em;
    min-width: 1ch;
}

#typed-text {
    background: linear-gradient(180deg, #0A246A, #0088FF, #0A246A);
    background-size: 100% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
    animation: titleGradientShift 4s ease-in-out infinite;
}

@keyframes titleGradientShift {
    0%, 100% { background-position: 0% 0%; }
    50%      { background-position: 0% 100%; }
}

#typewriter .cursor {
    display: inline-block;
    width: 3px;
    height: 0.8em;
    margin-left: 4px;
    background: #0088FF;
    box-shadow: 0 0 14px rgba(0, 140, 255, 1);
    animation: blink 0.8s step-end infinite;
    vertical-align: middle;
}

@keyframes blink {
    0%, 100% { opacity: 1; }
    50%      { opacity: 0; }
}

/* ─── BUTTONS ─── */
.buttons-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
    width: 100%;
}

.btn-wrapper {
    display: flex;
    justify-content: center;
    width: 100%;
}

.btn-merch,
.btn-discord {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    height: 54px;
    padding: 0 26px;
    font-size: 0.92rem;
    font-weight: 700;
    color: #000;
    border: 2px outset #ECE9D8;
    border-radius: 6px;
    text-decoration: none;
    letter-spacing: 0.6px;
    overflow: hidden;
    width: 260px;
    max-width: 100%;
    font-family: 'Tahoma', sans-serif;
    background: linear-gradient(180deg, #FFFFFF, #E8E4D8 45%, #D4D0C8);
    box-shadow:
        1px 1px 0 #FFFFFF inset,
        -1px -1px 0 #808080 inset,
        0 4px 12px rgba(0, 0, 0, 0.25);
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

.btn-merch::before,
.btn-discord::before {
    content: '';
    position: absolute;
    top: 0;
    left: -120%;
    width: 100%;
    height: 100%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.9), transparent);
    transition: left 0.9s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 1;
}

.btn-merch:hover::before,
.btn-discord:hover::before { left: 120%; }

.btn-merch:hover,
.btn-discord:hover {
    background: linear-gradient(180deg, #FFFFFF, #F4F0E2 45%, #E4E0D0);
    transform: translateY(-5px) scale(1.06);
    border-color: #00A8FF;
    box-shadow:
        1px 1px 0 #FFFFFF inset,
        -1px -1px 0 #808080 inset,
        0 14px 32px rgba(0, 140, 255, 0.55),
        0 0 60px rgba(0, 180, 255, 0.5);
}

.btn-merch:active,
.btn-discord:active {
    border: 2px inset #ECE9D8;
    transform: translateY(-1px) scale(0.96);
    box-shadow:
        -1px -1px 0 #FFFFFF inset,
        1px 1px 0 #808080 inset,
        0 2px 6px rgba(0, 0, 0, 0.4);
}

.btn-text { position: relative; z-index: 2; }

.discord-icon {
    width: 22px;
    height: 22px;
    fill: #5865F2;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    flex-shrink: 0;
    position: relative;
    z-index: 2;
}

.btn-discord:hover .discord-icon {
    transform: scale(1.3) rotate(-12deg);
    filter: drop-shadow(0 0 8px rgba(88, 101, 242, 1));
}

/* ─── DROPS PAGE (unavailable) ─── */
#dropsPage {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 100;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    padding: 30px 24px;
    background: #0a1220;
    text-align: center;
}

#dropsPage.active {
    display: flex;
    animation: pageSlideIn 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

@keyframes pageSlideIn {
    0%   { opacity: 0; transform: scale(0.94); }
    100% { opacity: 1; transform: scale(1); }
}

.unavailable-box {
    background: #ECE9D8;
    border: 3px solid #0054E3;
    border-radius: 12px;
    padding: 44px 36px;
    max-width: 480px;
    width: 100%;
    box-shadow:
        0 20px 60px rgba(0, 0, 0, 0.6),
        0 0 80px rgba(0, 140, 255, 0.5),
        0 0 140px rgba(0, 140, 255, 0.25);
    animation: windowGlow 5s ease-in-out infinite alternate;
}

.unavailable-icon {
    width: 72px;
    height: 72px;
    margin: 0 auto 22px;
    border-radius: 50%;
    background: linear-gradient(180deg, #FF6B5A, #C72C17);
    display: flex;
    align-items: center;
    justify-content: center;
    border: 3px solid #FFF;
    box-shadow: 0 6px 18px rgba(199, 44, 23, 0.6);
    animation: iconPulse 2s ease-in-out infinite;
}

@keyframes iconPulse {
    0%, 100% { transform: scale(1); box-shadow: 0 6px 18px rgba(199, 44, 23, 0.6); }
    50%      { transform: scale(1.06); box-shadow: 0 10px 28px rgba(199, 44, 23, 0.9); }
}

.unavailable-icon svg {
    width: 40px;
    height: 40px;
    fill: #FFF;
}

.unavailable-title {
    font-size: 1.6rem;
    font-weight: 700;
    color: #0A246A;
    margin-bottom: 12px;
    font-family: 'Tahoma', sans-serif;
    line-height: 1.25;
}

.unavailable-text {
    font-size: 0.92rem;
    color: #555;
    margin-bottom: 30px;
    font-family: 'Tahoma', sans-serif;
    line-height: 1.5;
}

.back-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 14px 32px;
    font-size: 0.92rem;
    font-weight: 700;
    border-radius: 6px;
    width: 100%;
    max-width: 300px;
    color: #000;
    background: linear-gradient(180deg, #FFFFFF, #E8E4D8 45%, #D4D0C8);
    border: 2px outset #ECE9D8;
    font-family: 'Tahoma', sans-serif;
    box-shadow:
        1px 1px 0 #FFFFFF inset,
        -1px -1px 0 #808080 inset,
        0 6px 14px rgba(0, 0, 0, 0.25);
    transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
}

.back-btn:hover {
    background: linear-gradient(180deg, #FFFFFF, #F4F0E2 45%, #E4E0D0);
    transform: translateY(-4px) scale(1.05);
    border-color: #0088FF;
    box-shadow:
        1px 1px 0 #FFFFFF inset,
        -1px -1px 0 #808080 inset,
        0 12px 28px rgba(0, 140, 255, 0.55),
        0 0 50px rgba(0, 180, 255, 0.4);
}

.back-btn svg { width: 16px; height: 16px; fill: #000; }

/* ─── MOBILE ─── */
@media (max-width: 480px) {
    body { padding: 10px; }
    .main-content { padding: 35px 18px; }
    #typewriter { font-size: 1.8rem; }
    .btn-merch, .btn-discord { height: 50px; font-size: 0.85rem; width: 220px; }
    .unavailable-box { padding: 34px 24px; }
    .unavailable-title { font-size: 1.35rem; }
    .unavailable-text { font-size: 0.85rem; }
}
</style>
</head>
<body>

<div class="custom-cursor" id="customCursor"></div>

<!-- MAIN PAGE -->
<div id="mainPage">
    <div class="main-content">
        <div class="title-wrapper">
            <h1 id="typewriter">
                <span id="typed-text"></span><span class="cursor"></span>
            </h1>
        </div>

        <div class="buttons-container">
            <div class="btn-wrapper">
                <button type="button" class="btn-merch" id="dropsBtn">
                    <span class="btn-text">Drops</span>
                </button>
            </div>

            <div class="btn-wrapper">
                <a href="https://discord.gg/8qCDcjFH7c" class="btn-discord" target="_blank" rel="noopener">
                    <svg class="discord-icon" viewBox="0 0 127.14 96.36" xmlns="http://www.w3.org/2000/svg">
                        <path d="M107.7,8.07A105.15,105.15,0,0,0,81.47,0a72.06,72.06,0,0,0-3.36,6.83A97.68,97.68,0,0,0,49,6.83,72.37,72.37,0,0,0,45.64,0,105.89,105.89,0,0,0,19.39,8.09C2.79,32.65-1.71,56.6.54,80.21h0A105.73,105.73,0,0,0,32.71,96.36,77.7,77.7,0,0,0,39.6,85.25a68.42,68.42,0,0,1-10.85-5.18c.91-.66,1.8-1.34,2.66-2a75.57,75.57,0,0,0,64.32,0c.87.71,1.76,1.39,2.66,2a68.68,68.68,0,0,1-10.87,5.19,77,77,0,0,0,6.89,11.1A105.25,105.25,0,0,0,126.6,80.22h0C129.24,52.84,122.09,29.11,107.7,8.07ZM42.45,65.69C36.18,65.69,31,60,31,53s5-12.74,11.43-12.74S53.9,46,53.9,53,48.77,65.69,42.45,65.69Zm42.24,0C78.41,65.69,73.21,60,73.21,53s5-12.74,11.44-12.74S96.12,46,96.12,53,91,65.69,84.69,65.69Z"/>
                    </svg>
                    <span class="btn-text">Discord</span>
                </a>
            </div>
        </div>
    </div>
</div>

<!-- DROPS UNAVAILABLE PAGE -->
<div id="dropsPage">
    <div class="unavailable-box">
        <div class="unavailable-icon">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
            </svg>
        </div>
        <div class="unavailable-title">Cleetus Drop is temporarily unavailable</div>
        <div class="unavailable-text">Please check back later. We are currently working on something big.</div>
        <button type="button" class="back-btn" id="backBtn">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
            <span>Back to Home</span>
        </button>
    </div>
</div>

<script>
try {
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
} catch (e) {}

function $(id) { return document.getElementById(id); }

function playSound(freq) {
    freq = freq || 800;
    try {
        var ctx = new (window.AudioContext || window.webkitAudioContext)();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = freq;
        osc.type = 'sine';
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.12);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.12);
    } catch (e) {}
}

/* ─── TYPEWRITER ─── */
(function typewriter() {
    var target = $('typed-text');
    if (!target) return;
    var word = 'Cleetus Drop';
    var idx = 0;
    var deleting = false;
    var speed = 150;

    function step() {
        if (!deleting) {
            target.textContent = word.substring(0, idx + 1);
            idx++;
            if (idx === word.length) {
                deleting = true;
                speed = 2200;
                setTimeout(function () { speed = 70; }, 2200);
            }
        } else {
            target.textContent = word.substring(0, idx - 1);
            idx--;
            if (idx === 0) {
                deleting = false;
                speed = 130;
            }
        }
        setTimeout(step, speed);
    }
    step();
})();

/* ─── PAGE NAV ─── */
function showDrops() {
    playSound(500);
    var main = $('mainPage');
    var drops = $('dropsPage');
    main.style.display = 'none';
    drops.style.display = 'flex';
    drops.classList.add('active');
    try { window.Telegram.WebApp.expand(); } catch (e) {}
}

function hideDrops() {
    playSound(800);
    var main = $('mainPage');
    var drops = $('dropsPage');
    drops.style.display = 'none';
    drops.classList.remove('active');
    main.style.display = 'block';
    try { window.Telegram.WebApp.expand(); } catch (e) {}
}

/* ─── EVENT BINDINGS ─── */
function bindAll() {
    var dropsBtn = $('dropsBtn');
    var backBtn = $('backBtn');

    if (dropsBtn && !dropsBtn.dataset.bound) {
        dropsBtn.addEventListener('click', showDrops);
        dropsBtn.dataset.bound = '1';
    }
    if (backBtn && !backBtn.dataset.bound) {
        backBtn.addEventListener('click', hideDrops);
        backBtn.dataset.bound = '1';
    }
}
document.addEventListener('DOMContentLoaded', bindAll);
setTimeout(bindAll, 0);

/* ─── CURSOR ─── */
(function () {
    var cursor = $('customCursor');
    if (!cursor) return;

    var isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
    if (isTouch) {
        cursor.style.display = 'none';
        return;
    }

    document.addEventListener('mousemove', function (e) {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
        cursor.style.opacity = '1';
    });

    document.addEventListener('mouseleave', function () {
        cursor.style.opacity = '0';
    });

    var sel = 'button, a, .back-btn, .btn-merch, .btn-discord';
    document.addEventListener('mouseover', function (e) {
        if (e.target.closest(sel)) cursor.classList.add('hover');
    });
    document.addEventListener('mouseout', function (e) {
        if (e.target.closest(sel)) cursor.classList.remove('hover');
    });

    document.addEventListener('mousedown', function () { cursor.classList.add('click'); });
    document.addEventListener('mouseup', function () { cursor.classList.remove('click'); });
})();

/* ─── INTERACTIVE BACKGROUND ─── */
document.addEventListener('mousemove', function (e) {
    var x = (e.clientX / window.innerWidth) * 100;
    var y = (e.clientY / window.innerHeight) * 100;
    document.documentElement.style.setProperty('--mx', x + '%');
    document.documentElement.style.setProperty('--my', y + '%');
});

/* ─── KEYBOARD ─── */
document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && $('dropsPage').classList.contains('active')) {
        hideDrops();
    }
});
</script>

</body>
</html>
