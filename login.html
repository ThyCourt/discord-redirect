<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Sign In — Cleetus</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
    min-height: 100vh;
    font-family: Verdana, Tahoma, Arial, sans-serif;
    font-size: 11px;
    background: #F5F5F0;
    color: #000000;
}

body { padding: 0; }

.page-wrap {
    max-width: 1000px;
    margin: 0 auto;
    padding: 20px 14px 40px;
    min-height: 100vh;
}

.banner-wrap {
    width: 100%;
    background: #F5F5F0;
    text-align: center;
    border-bottom: 1px solid #C8C8C0;
}
.banner-wrap img { display: block; width: 100%; max-width: 2172px; height: auto; margin: 0 auto; }

.header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 10px 4px 12px;
    border-bottom: 1px solid #C8C8C0;
    margin-bottom: 12px;
}

.page-title {
    font-family: 'Times New Roman', Times, serif;
    font-size: 2.2rem;
    font-weight: bold;
    color: #000000;
    line-height: 1.2;
}

.header-right { font-size: 10px; color: #666666; text-align: right; }
.header-right a { color: #0000CC; text-decoration: underline; }

.box {
    background: #FFFFFF;
    border: 1px solid #B0B0A8;
    max-width: 400px;
    margin: 0 auto;
}

.box-title {
    background: #E8E4D8;
    border-bottom: 1px solid #B0B0A8;
    padding: 4px 8px;
    font-size: 11px;
    font-weight: bold;
}

.box-body { padding: 14px; }

label {
    display: block;
    font-weight: bold;
    font-size: 10px;
    margin-bottom: 3px;
    margin-top: 10px;
}
label:first-of-type { margin-top: 0; }

input[type="email"],
input[type="password"] {
    width: 100%;
    padding: 5px;
    border: 1px solid #B0B0A8;
    font-family: Verdana, Tahoma, Arial, sans-serif;
    font-size: 11px;
    background: #FFFFFF;
    color: #000000;
    outline: none;
}
input[type="email"]:focus,
input[type="password"]:focus { border-color: #0000CC; }

.btn {
    display: block;
    width: 100%;
    margin-top: 14px;
    padding: 5px 14px;
    background: #D4D0C8;
    border-top: 1px solid #FFFFFF;
    border-left: 1px solid #FFFFFF;
    border-right: 1px solid #808080;
    border-bottom: 1px solid #808080;
    font-family: Verdana, Tahoma, Arial, sans-serif;
    font-size: 11px;
    font-weight: bold;
    color: #000000;
    cursor: pointer;
}
.btn:hover { background: #E0DCD0; color: #0000CC; }
.btn:active {
    border-top: 1px solid #808080;
    border-left: 1px solid #808080;
    border-right: 1px solid #FFFFFF;
    border-bottom: 1px solid #FFFFFF;
}
.btn:disabled { opacity: 0.6; cursor: default; }

.alt-link {
    display: block;
    text-align: center;
    margin-top: 12px;
    font-size: 10px;
}
.alt-link a { color: #0000CC; text-decoration: underline; }
.alt-link a:hover { color: #CC0000; }

#msg {
    margin-top: 12px;
    padding: 6px 8px;
    font-size: 10px;
    line-height: 1.5;
    display: none;
    border: 1px solid #B0B0A8;
    background: #F5F5F0;
}
#msg.error { display: block; color: #CC0000; border-color: #CC0000; }
#msg.ok    { display: block; color: #008000; border-color: #008000; }

.footer {
    margin-top: 24px;
    padding: 12px 4px;
    border-top: 1px solid #C8C8C0;
    font-size: 10px;
    color: #888888;
    text-align: center;
}
.footer a { color: #0000CC; text-decoration: underline; }

@media (max-width: 480px) {
    .page-wrap { padding: 12px 8px 30px; }
    .page-title { font-size: 1.6rem; }
}
</style>
</head>
<body>

<div class="banner-wrap">
    <img src="banner.png" alt="Cleetus Banner" />
</div>

<div class="page-wrap">

    <div class="header">
        <div class="page-title" id="pageTitle">Sign In</div>
        <div class="header-right">
            <a href="index.html">&laquo; Back to Home</a>
        </div>
    </div>

    <div class="box">
        <div class="box-title" id="boxTitle">Member Login</div>
        <div class="box-body">

            <label for="email">Email:</label>
            <input type="email" id="email" autocomplete="email" />

            <label for="password">Password:</label>
            <input type="password" id="password" autocomplete="current-password" />

            <button class="btn" id="submitBtn">Sign In</button>

            <div id="msg"></div>

            <div class="alt-link">
                <a href="#" id="toggleMode">Need an account? Create one</a>
            </div>
            <div class="alt-link" id="forgotWrap">
                <a href="#" id="forgotLink">Forgot your password?</a>
            </div>

        </div>
    </div>

    <div class="footer">
        <a href="#">Terms of Service</a>
    </div>

</div>

<!-- FIREBASE -->
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
<script src="firebase-config.js"></script>

<script>
try {
    if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
    }
} catch (e) {}

function $(id) { return document.getElementById(id); }

var mode = 'login';

var pageTitle  = $('pageTitle');
var boxTitle   = $('boxTitle');
var submitBtn  = $('submitBtn');
var toggleMode = $('toggleMode');
var forgotWrap = $('forgotWrap');
var forgotLink = $('forgotLink');
var msg        = $('msg');

function setMsg(text, type) {
    msg.textContent = text;
    msg.className = type || '';
}

function applyMode() {
    if (mode === 'login') {
        pageTitle.textContent = 'Sign In';
        boxTitle.textContent  = 'Member Login';
        submitBtn.textContent = 'Sign In';
        toggleMode.textContent = 'Need an account? Create one';
        forgotWrap.style.display = 'block';
        $('password').setAttribute('autocomplete', 'current-password');
    } else {
        pageTitle.textContent = 'Create Account';
        boxTitle.textContent  = 'New Member Registration';
        submitBtn.textContent = 'Create Account';
        toggleMode.textContent = 'Already a member? Sign in';
        forgotWrap.style.display = 'none';
        $('password').setAttribute('autocomplete', 'new-password');
    }
    setMsg('', '');
}

toggleMode.addEventListener('click', function (e) {
    e.preventDefault();
    mode = (mode === 'login') ? 'signup' : 'login';
    applyMode();
});

submitBtn.addEventListener('click', function () {
    var email    = $('email').value.trim();
    var password = $('password').value;

    if (!email || !password) {
        setMsg('Please enter both an email and a password.', 'error');
        return;
    }
    if (password.length < 6) {
        setMsg('Password must be at least 6 characters.', 'error');
        return;
    }

    submitBtn.disabled = true;
    setMsg('Working…', '');

    if (mode === 'login') {
        auth.signInWithEmailAndPassword(email, password)
            .then(function () {
                setMsg('Signed in. Redirecting…', 'ok');
                setTimeout(function () { window.location.href = 'index.html'; }, 700);
            })
            .catch(function (err) {
                submitBtn.disabled = false;
                setMsg(prettyError(err), 'error');
            });
    } else {
        auth.createUserWithEmailAndPassword(email, password)
            .then(function () {
                setMsg('Account created. Redirecting…', 'ok');
                setTimeout(function () { window.location.href = 'index.html'; }, 700);
            })
            .catch(function (err) {
                submitBtn.disabled = false;
                setMsg(prettyError(err), 'error');
            });
    }
});

forgotLink.addEventListener('click', function (e) {
    e.preventDefault();
    var email = $('email').value.trim();
    if (!email) {
        setMsg('Type your email above first, then click "Forgot your password?".', 'error');
        return;
    }
    auth.sendPasswordResetEmail(email)
        .then(function () { setMsg('Reset link sent. Check your inbox.', 'ok'); })
        .catch(function (err) { setMsg(prettyError(err), 'error'); });
});

function prettyError(err) {
    var code = (err && err.code) ? err.code : '';
    switch (code) {
        case 'auth/invalid-email':          return 'That email address looks invalid.';
        case 'auth/user-not-found':         return 'No account found with that email.';
        case 'auth/wrong-password':         return 'Incorrect password.';
        case 'auth/invalid-credential':     return 'Email or password is incorrect.';
        case 'auth/email-already-in-use':   return 'That email is already registered. Try signing in.';
        case 'auth/weak-password':          return 'Password must be at least 6 characters.';
        case 'auth/too-many-requests':      return 'Too many attempts. Wait a minute and try again.';
        case 'auth/network-request-failed': return 'Network error. Check your connection.';
        case 'auth/unauthorized-domain':    return 'This domain is not authorized in Firebase. Add it under Authentication → Settings → Authorized domains.';
        default:                            return err && err.message ? err.message : 'Something went wrong.';
    }
}

auth.onAuthStateChanged(function (user) {
    if (user) { window.location.href = 'index.html'; }
});

applyMode();
</script>

</body>
</html>
